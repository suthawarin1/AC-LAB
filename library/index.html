<script>
(function(){
  const STYLE_ID='aw-notice-style';
  const HOST_ID='aw-notice-host';
  let loadingNode=null;
  let loadingTimer=null;
  function setup(){
    if(document.body && document.body.style.overflow==='hidden') document.body.style.overflow='';
    if(!document.getElementById(STYLE_ID)){
      const style=document.createElement('style');
      style.id=STYLE_ID;
      style.textContent=`
        #${HOST_ID}{position:fixed;z-index:2147483000;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));display:grid;gap:10px;width:min(420px,calc(100vw - 28px));pointer-events:none}
        .aw-notice{pointer-events:auto;display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:start;padding:13px 14px;border:1px solid #dfe4ef;border-radius:16px;background:rgba(255,255,255,.98);color:#17203a;box-shadow:0 18px 55px rgba(20,28,60,.20);animation:awNoticeIn .18s ease-out}
        .aw-notice.success{border-color:#cdeede}.aw-notice.error{border-color:#ffd1da}.aw-notice.info{border-color:#d7e5ff}.aw-notice.loading{border-color:#d8dafd}
        .aw-notice-icon{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:900;background:#eef0ff;color:#5557d9}
        .aw-notice.success .aw-notice-icon{background:#e8faf2;color:#08744f}.aw-notice.error .aw-notice-icon{background:#fff0f3;color:#b82d4b}.aw-notice.info .aw-notice-icon{background:#eef6ff;color:#315f8d}
        .aw-notice-copy b{display:block;font-size:13px}.aw-notice-copy span{display:block;margin-top:3px;color:#6f7992;font-size:11px;line-height:1.55;overflow-wrap:anywhere}
        .aw-notice-close{border:0;background:transparent;color:#8b94aa;font-size:18px;line-height:1;cursor:pointer;padding:2px}
        .aw-notice-spin{width:18px;height:18px;border:3px solid #d9dcfb;border-top-color:#5757df;border-radius:50%;animation:awNoticeSpin .75s linear infinite}
        @keyframes awNoticeSpin{to{transform:rotate(360deg)}}@keyframes awNoticeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
        @media(max-width:620px){#${HOST_ID}{left:10px;right:10px;top:max(10px,env(safe-area-inset-top));width:auto}.aw-notice{border-radius:14px}}
      `;
      document.head.appendChild(style);
    }
    let host=document.getElementById(HOST_ID);
    if(!host){host=document.createElement('div');host.id=HOST_ID;host.setAttribute('aria-live','polite');document.body.appendChild(host)}
    return host;
  }
  function remove(node){if(node?.isConnected)node.remove();if(node===loadingNode)loadingNode=null}
  function show(type,title,text='',duration=3500){
    const host=setup();
    const node=document.createElement('div');
    node.className=`aw-notice ${type}`;
    const icon=document.createElement('div');icon.className='aw-notice-icon';
    if(type==='loading'){const spin=document.createElement('i');spin.className='aw-notice-spin';icon.appendChild(spin)}
    else icon.textContent=type==='success'?'✓':type==='error'?'!':'i';
    const copy=document.createElement('div');copy.className='aw-notice-copy';
    const strong=document.createElement('b');strong.textContent=String(title||'');copy.appendChild(strong);
    if(text){const span=document.createElement('span');span.textContent=String(text);copy.appendChild(span)}
    const close=document.createElement('button');close.type='button';close.className='aw-notice-close';close.setAttribute('aria-label','ปิด');close.textContent='×';close.onclick=()=>remove(node);
    node.append(icon,copy,close);host.appendChild(node);
    if(duration>0)setTimeout(()=>remove(node),duration);
    return node;
  }
  function closeLoading(){clearTimeout(loadingTimer);loadingTimer=null;remove(loadingNode)}
  window.AWAlert={
    loading:(title='กำลังดำเนินการ',text='กรุณารอสักครู่')=>{closeLoading();loadingNode=show('loading',title,text,0);loadingTimer=setTimeout(()=>remove(loadingNode),30000);return Promise.resolve({isConfirmed:true})},
    close:()=>closeLoading(),
    success:(title='สำเร็จ',text='')=>{closeLoading();show('success',title,text,3800);return Promise.resolve({isConfirmed:true})},
    error:(title='เกิดข้อผิดพลาด',text='')=>{closeLoading();show('error',title,text,6500);return Promise.resolve({isConfirmed:true})},
    info:(title='แจ้งข้อมูล',text='')=>{closeLoading();show('info',title,text,4800);return Promise.resolve({isConfirmed:true})},
    confirm:(title,text='',confirmText='ยืนยัน')=>Promise.resolve({isConfirmed:window.confirm([title,text,`กด OK เพื่อ${confirmText}`].filter(Boolean).join('\n'))}),
    toast:(title,icon='success')=>{show(icon==='error'?'error':icon==='info'?'info':'success',title,'',icon==='error'?5500:3200);return Promise.resolve({isConfirmed:true})}
  };
  const boot=()=>setup();
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})();
</script>

<script>
const CONFIG={url:"https://wurqxpzlluetcbifdicq.supabase.co",key:"sb_publishable_jJqnUnUHBLeLJ1wH5PKIBw_iMtzVImc"};
const {createClient}=supabase;const sb=createClient(CONFIG.url,CONFIG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const app=document.getElementById('app'),modalRoot=document.getElementById('modal');
const S={data:null,session:null,category:'all',subject:null,search:'',filter:'all'};let searchTimer=null;
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)],esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

async function rpc(name,args={}){const{data,error}=await sb.rpc(name,args);if(error)throw error;return data}
function authHtml(){return `<div class="auth"><section class="hero"><div class="brand"><div class="logo">AW</div><div><strong>AreWarin Library V11.1</strong><small>หนังสือ ชีท วิดีโอ และคลังความรู้</small></div></div><div class="copy"><h1>ห้องสมุดที่<br>เชื่อมกับการเรียน</h1><p>ค้นหาหนังสือมาใหม่ เก็บรายการโปรด เปิดประวัติล่าสุด และใช้สื่อที่ได้รับสิทธิ์ตามคอร์สด้วยรหัสสมาชิกเดียวกับระบบหลัก</p><div class="feature-row"><span class="feature">หนังสือมาใหม่</span><span class="feature">รายการโปรด</span><span class="feature">ประวัติล่าสุด</span><span class="feature">สิทธิ์รายคอร์ส</span></div></div><div class="brand"><small>Student ID หรือ Tutor Code + รหัสผ่านเดิม</small></div></section><section class="panel"><div class="auth-card"><h2>เข้าสู่ห้องสมุด</h2><p>นักเรียนใช้ Student ID ติวเตอร์ใช้ Tutor Code หรือใช้อีเมลของบัญชีเดิม</p><div id="msg"></div><form id="login"><div class="field"><label>Student ID / Tutor Code / อีเมล</label><input class="input" name="identifier" required autocomplete="username"></div><div class="field"><label>รหัสผ่าน</label><input class="input" type="password" name="password" required autocomplete="current-password"></div><button class="btn primary wide">เข้าสู่ Library</button></form><div class="message" style="margin-top:14px;margin-bottom:0">บัญชีต้องเปิดใช้งานใน Student Portal หรือ Tutor Hub ก่อน</div></div></section></div>`}
function catName(id){return S.data.categories.find(x=>x.id===id)?.name||''}function sub(id){return S.data.subjects.find(x=>x.id===id)}
function isNew(b){return b.is_new&&new Date(b.new_until)>new Date()}function favoriteIds(){return new Set(S.data.favorite_book_ids||[])}
function visibleSubjects(){let rows=(S.data.subjects||[]).filter(x=>x.is_active!==false);if(S.category!=='all')rows=rows.filter(x=>x.category_id===S.category);const q=S.search.toLowerCase();if(q)rows=rows.filter(x=>`${x.name} ${x.description}`.toLowerCase().includes(q));return rows}
function books(){let rows=(S.data.books||[]);if(S.subject)rows=rows.filter(x=>x.subject_id===S.subject);else if(S.category!=='all'){const ids=new Set(visibleSubjects().map(x=>x.id));rows=rows.filter(x=>ids.has(x.subject_id))}const q=S.search.toLowerCase();if(q)rows=rows.filter(x=>`${x.title} ${x.subtitle} ${x.author} ${x.publisher} ${x.isbn} ${x.description}`.toLowerCase().includes(q));const fav=favoriteIds(),recent=new Set(S.data.recent_book_ids||[]);if(S.filter==='new')rows=rows.filter(isNew);if(S.filter==='favorites')rows=rows.filter(x=>fav.has(x.id));if(S.filter==='recent')rows=rows.filter(x=>recent.has(x.id)).sort((a,b)=>(S.data.recent_book_ids.indexOf(a.id)-S.data.recent_book_ids.indexOf(b.id)));return rows}
function resources(){let rows=(S.data.resources||[]).filter(x=>x.is_published!==false);if(S.subject)rows=rows.filter(x=>x.subject_id===S.subject);else if(S.category!=='all'){const ids=new Set(visibleSubjects().map(x=>x.id));rows=rows.filter(x=>ids.has(x.subject_id))}const q=S.search.toLowerCase();if(q)rows=rows.filter(x=>`${x.title} ${x.description}`.toLowerCase().includes(q));return rows}
function assets(bookId){return (S.data.book_assets||[]).filter(x=>x.book_id===bookId&&x.is_published!==false)}
function backUrl(){return S.data.member.role==='student'?'../student/':S.data.member.role==='tutor'?'../staff/':'../'}
function iconFor(t){return({youtube:'▶️',video:'🎬',document:'📄',drive:'☁️',quiz:'🧠',image:'🖼️',website:'🌐',link:'🔗'})[t]||'🔗'}
function shell(){const m=S.data.member,bs=books(),rs=resources(),fav=favoriteIds(),newCount=(S.data.books||[]).filter(isNew).length;return `<header class="topbar"><div class="brand"><div class="logo" style="width:42px;height:42px;border-radius:14px">AW</div><div><strong>AreWarin Library V11.1</strong><small>${esc(m.name)} · ${esc(m.role)}</small></div></div><div class="member"><span class="member-code">${esc(m.code)}</span><div class="top-actions"><a class="btn ghost" href="${backUrl()}">กลับ Portal</a><button class="btn" data-logout>ออกจากระบบ</button></div></div></header><main class="page"><section class="library-hero"><div><span class="chip">CONNECTED DIGITAL LIBRARY</span><h1>ห้องสมุดของ ${esc(m.name)}</h1><p>รายการทั้งหมดถูกกรองตามสิทธิ์ของบัญชี คอร์ส นักเรียน และติวเตอร์ พร้อมแจ้งหนังสือมาใหม่จากระบบหลัก</p></div><div class="hero-stats"><div class="stat"><small>หนังสือที่เปิดได้</small><b>${S.data.books.length}</b></div><div class="stat"><small>หนังสือมาใหม่</small><b>${newCount}</b></div><div class="stat"><small>รายการโปรด</small><b>${fav.size}</b></div><div class="stat"><small>สื่อ/ลิงก์</small><b>${S.data.resources.length}</b></div></div></section><div class="toolbar"><input class="search" id="search" placeholder="ค้นหาชื่อหนังสือ ผู้แต่ง ISBN วิชา หรือชีท..." value="${esc(S.search)}"><button class="btn" data-refresh>รีเฟรช</button></div><div class="filters">${[['all','ทั้งหมด'],['new','🆕 หนังสือมาใหม่'],['favorites','♥ รายการโปรด'],['recent','◷ เปิดล่าสุด']].map(([id,l])=>`<button class="filter ${S.filter===id?'active':''}" data-filter="${id}">${l}</button>`).join('')}</div><div class="categories"><button class="category ${S.category==='all'?'active':''}" data-cat="all">ทุกหมวด</button>${S.data.categories.filter(x=>x.is_active!==false).map(c=>`<button class="category ${S.category===c.id?'active':''}" data-cat="${c.id}">${esc(c.icon||'📚')} ${esc(c.name)}</button>`).join('')}</div>${!S.subject?`<div class="section-head"><div><h2>หมวดวิชา</h2><p>เลือกวิชาเพื่อกรองหนังสือและสื่อ</p></div></div><div class="subject-grid">${visibleSubjects().map(x=>`<article class="subject" data-subject="${x.id}"><div class="subject-cover" style="${x.cover_url?`background-image:url('${esc(x.cover_url)}')`:''}"><div class="subject-name">${esc(x.name)}</div></div><div class="subject-body"><span class="chip">${esc(catName(x.category_id))}</span><p>${esc(x.description||'เปิดคลังความรู้ของวิชานี้')}</p></div></article>`).join('')||'<div class="empty" style="grid-column:1/-1">ยังไม่มีวิชาในหมวดนี้</div>'}</div>`:`<div class="section-head"><div><button class="btn ghost small" data-back-subject>← ทุกวิชา</button><h2 style="margin-top:11px">${esc(sub(S.subject)?.name||'วิชา')}</h2></div></div>`}<div class="section-head"><div><h2>${S.filter==='new'?'หนังสือมาใหม่':S.filter==='favorites'?'รายการโปรด':S.filter==='recent'?'เปิดล่าสุด':'หนังสือและเอกสาร'}</h2><p>กดดูรายละเอียดก่อนเปิดลิงก์หรือดาวน์โหลด</p></div><span class="chip">${bs.length} รายการ</span></div><div class="book-grid">${bs.map(b=>`<article class="book"><div class="book-cover" style="${b.cover_url?`background-image:url('${esc(b.cover_url)}')`:''}">${b.cover_url?'':'📖'}${isNew(b)?'<span class="new-badge">มาใหม่</span>':''}<button class="fav ${fav.has(b.id)?'on':''}" data-fav="${b.id}" title="รายการโปรด">${fav.has(b.id)?'♥':'♡'}</button></div><div class="book-body"><span class="chip ${isNew(b)?'red':''}">${esc(sub(b.subject_id)?.name||'Library')}</span><h3>${esc(b.title)}</h3><p>${esc(b.author||'ไม่ระบุผู้แต่ง')} ${b.publication_year?'· '+esc(b.publication_year):''}</p><p>${esc(b.description||'เปิดดูรายละเอียดและลิงก์ที่เกี่ยวข้อง')}</p><button class="btn primary wide" data-book="${b.id}">ดูรายละเอียด</button></div></article>`).join('')||'<div class="empty" style="grid-column:1/-1">ไม่พบหนังสือตามเงื่อนไขนี้</div>'}</div><div class="section-head"><div><h2>ลิงก์และทรัพยากรอื่น</h2><p>เว็บไซต์ วิดีโอ ชีท แบบทดสอบ และ Google Drive</p></div><span class="chip">${rs.length} รายการ</span></div><div class="resource-grid">${rs.map(r=>`<article class="resource"><div class="thumb" style="${r.thumbnail_url?`background-image:url('${esc(r.thumbnail_url)}')`:''}">${r.thumbnail_url?'':iconFor(r.resource_type)}</div><div class="resource-body"><span class="chip">${esc(sub(r.subject_id)?.name||'Library')}</span><h3>${esc(r.title)}</h3><p>${esc(r.description||'เปิดทรัพยากรเพื่อเรียนรู้เพิ่มเติม')}</p><button class="btn primary wide" data-resource="${r.id}">เปิดดู</button></div></article>`).join('')||'<div class="empty" style="grid-column:1/-1">ยังไม่มีทรัพยากรในส่วนนี้</div>'}</div></main>`}
function showBook(id){const b=S.data.books.find(x=>x.id===id);if(!b)return;const list=assets(id);modalRoot.className='modal-bg';modalRoot.innerHTML=`<section class="modal"><header class="modal-head"><h3>${esc(b.title)}</h3><button class="btn small" data-close>✕</button></header><div class="modal-body"><div class="book-detail"><div class="detail-cover" style="${b.cover_url?`background-image:url('${esc(b.cover_url)}')`:''}">${b.cover_url?'':'📖'}</div><div><span class="chip">${esc(sub(b.subject_id)?.name||'Library')}</span>${isNew(b)?'<span class="chip red" style="margin-left:6px">หนังสือมาใหม่</span>':''}<h2>${esc(b.title)}</h2>${b.subtitle?`<h3>${esc(b.subtitle)}</h3>`:''}<p><b>ผู้แต่ง:</b> ${esc(b.author||'—')}<br><b>สำนักพิมพ์:</b> ${esc(b.publisher||'—')}<br><b>ISBN:</b> ${esc(b.isbn||'—')}<br><b>ปีพิมพ์:</b> ${esc(b.publication_year||'—')}</p><p style="color:var(--muted);line-height:1.8">${esc(b.description||'')}</p><div class="asset-list">${list.map(a=>`<div class="asset-link"><div><b>${esc(a.label)}</b><div class="chip">${esc(a.asset_type)}</div></div><button class="btn primary small" data-open-asset="${a.id}">เปิด</button></div>`).join('')||'<div class="message">หนังสือนี้ยังไม่มีลิงก์อ่านหรือดาวน์โหลด กรุณาติดต่อผู้ดูแล</div>'}</div></div></div></div><footer class="modal-actions"><button class="btn" data-close>ปิด</button></footer></section>`;$$('[data-close]',modalRoot).forEach(x=>x.onclick=()=>{modalRoot.className='hidden';modalRoot.innerHTML='' });$$('[data-open-asset]',modalRoot).forEach(x=>x.onclick=async()=>{const a=S.data.book_assets.find(v=>v.id===x.dataset.openAsset);try{await rpc('library_v11_record_book_open',{p_book_id:b.id});if(a.url)window.open(a.url,'_blank','noopener,noreferrer');else toast('ยังไม่มี URL สำหรับรายการนี้',true);await load(false)}catch(e){toast(e.message,true)}})}
function bind(){$$('[data-cat]').forEach(b=>b.onclick=()=>{S.category=b.dataset.cat;S.subject=null;render()});$$('[data-filter]').forEach(b=>b.onclick=()=>{S.filter=b.dataset.filter;render()});$$('[data-subject]').forEach(x=>x.onclick=()=>{S.subject=x.dataset.subject;render()});$('[data-back-subject]')?.addEventListener('click',()=>{S.subject=null;render()});$('#search')?.addEventListener('input',e=>{S.search=e.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{render();const q=$('#search');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}},150)});$('[data-refresh]')?.addEventListener('click',()=>load());$('[data-logout]')?.addEventListener('click',logout);$$('[data-book]').forEach(b=>b.onclick=()=>showBook(b.dataset.book));$$('[data-fav]').forEach(b=>b.onclick=async e=>{e.stopPropagation();try{const on=await rpc('library_v11_toggle_favorite',{p_book_id:b.dataset.fav});const ids=new Set(S.data.favorite_book_ids||[]);if(on)ids.add(b.dataset.fav);else ids.delete(b.dataset.fav);S.data.favorite_book_ids=[...ids];render();toast(on?'เพิ่มในรายการโปรดแล้ว':'นำออกจากรายการโปรดแล้ว')}catch(x){toast(x.message,true)}});$$('[data-resource]').forEach(b=>b.onclick=async()=>{const r=S.data.resources.find(x=>x.id===b.dataset.resource);try{await rpc('library_v10_record_open',{p_resource_id:r.id})}catch{}window.open(r.url,'_blank','noopener,noreferrer')})}
function render(){app.className='';app.innerHTML=shell();bind()}
async function load(show=true){if(show){app.className='loading';app.innerHTML='<div><div class="spinner"></div><b>กำลังโหลดหนังสือและสิทธิ์...</b></div>'}try{S.data=await rpc('library_v11_bootstrap');render()}catch(e){app.className='';app.innerHTML=authHtml();const box=$('#msg');box.innerHTML=`<div class="message error">${esc(e.message)}</div>`;bindAuth()}}
async function codeLogin(identifier,password){const res=await fetch(`${CONFIG.url}/functions/v1/student-auth`,{method:'POST',headers:{'Content-Type':'application/json',apikey:CONFIG.key,Authorization:`Bearer ${CONFIG.key}`},body:JSON.stringify({action:'login_by_code',member_code:identifier,password})});const data=await res.json().catch(()=>({}));if(!res.ok||!data.ok)throw new Error(data.message||'เข้าสู่ระบบไม่สำเร็จ');const{error}=await sb.auth.setSession({access_token:data.session.access_token,refresh_token:data.session.refresh_token});if(error)throw error;return data}
function bindAuth(){$('#login').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,fd=new FormData(form),id=String(fd.get('identifier')).trim(),password=String(fd.get('password')),button=form.querySelector('button[type=submit]'),box=$('#msg');if(button){button.disabled=true;button.dataset.oldText=button.textContent;button.textContent='กำลังเข้าสู่ระบบ...'}if(box)box.innerHTML='<div class="message">กำลังตรวจสอบบัญชี...</div>';try{if(id.includes('@')){const{error}=await sb.auth.signInWithPassword({email:id.toLowerCase(),password});if(error)throw error}else await codeLogin(id,password);if(box)box.innerHTML='';await load()}catch(x){const message=String(x.message||x);if(box)box.innerHTML=`<div class="message error">${esc(message)}</div>`;toast(message,true)}finally{if(button&&button.isConnected){button.disabled=false;button.textContent=button.dataset.oldText||'เข้าสู่ระบบ'}}}}
async function logout(){await sb.auth.signOut({scope:'local'});S.data=null;S.session=null;app.className='';app.innerHTML=authHtml();bindAuth()}
(async()=>{const{data}=await sb.auth.getSession();S.session=data.session;if(S.session)await load();else{app.className='';app.innerHTML=authHtml();bindAuth()}})();
</script>
</body>
</html>
