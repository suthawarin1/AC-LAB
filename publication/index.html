:root {
  --teal-50: #e0f2f1;
  --teal-100: #b2dfdb;
  --teal-200: #80cbc4;
  --teal-300: #4db6ac;
  --teal-400: #26a69a;
  --teal-500: #009688;
  --teal-600: #00897b;
  --teal-700: #00796b;
  --ink: #123c38;
  --muted: #5c7470;
  --white: #fff;
  --paper: #fcfdfb;
  --line: #dce9e5;
  --display: "Fraunces", Georgia, serif;
  --sans: "DM Sans", "Anuphan", system-ui, sans-serif;
  --thai: "Anuphan", sans-serif;
  --thai-display: "Noto Serif Thai", serif;
  --header-h: 68px;
  --gutter: clamp(24px, 4.8vw, 88px);
  --radius: 22px;
  --ease: cubic-bezier(.22, .61, .36, 1);
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: var(--header-h); }
body { margin: 0; color: var(--ink); background: var(--paper); font: 400 16px/1.65 var(--sans); -webkit-font-smoothing: antialiased; }
body:lang(th) { font-family: var(--thai); line-height: 1.85; }
body.menu-open { overflow: hidden; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; border: 0; background: none; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, p, figure { margin: 0; }
img { display: block; width: 100%; height: 100%; object-fit: cover; }
svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.icon { vertical-align: middle; }
::selection { color: var(--ink); background: var(--teal-200); }
:focus-visible { outline: 3px solid var(--teal-400); outline-offset: 4px; }
.wrap { width: 100%; max-width: 1600px; padding-inline: var(--gutter); margin-inline: auto; }
.shell { width: calc(min(100%, 1600px) - 2 * var(--gutter)); margin-inline: auto; }
.display { font: 300 1em/1.05 var(--display); letter-spacing: -.045em; }
.display:lang(th) { font-family: var(--thai-display); font-weight: 500; line-height: 1.5; letter-spacing: -.015em; }
.eyebrow { display: flex; font-family: var(--sans); align-items: center; gap: 12px; color: var(--teal-700); font-size: 10px; font-weight: 650; letter-spacing: .19em; text-transform: uppercase; }
.eyebrow::before { content: ""; width: 28px; height: 1px; background: currentColor; flex: none; }
.eyebrow:lang(th) { font: 650 12px/1.85 var(--thai); letter-spacing: .03em; }
.text-link, .icon-link { display: inline-flex; align-items: center; gap: 12px; font-size: 13px; font-weight: 550; }
.text-link { gap: 18px; padding-block: 12px; }
.text-link svg, .icon-link svg { transition: transform .25s var(--ease); }
.text-link:hover svg, .icon-link:hover svg { transform: translateX(5px); }
.skip-link { position: fixed; top: 14px; left: 20px; z-index: 100; padding: 10px 18px; background: white; transform: translateY(-160%); }
.skip-link:focus { transform: translateY(0); }

/* Compact navigation shared with the main website. */
.site-header { position: sticky; top: 0; z-index: 40; background: #fcfdfbf2; border-bottom: 1px solid var(--line); backdrop-filter: blur(14px); }
.header-inner { display: flex; align-items: center; justify-content: space-between; gap: 22px; min-height: var(--header-h); }
.wordmark { display: flex; flex-direction: column; gap: 5px; font-family: "DM Sans", sans-serif; }
.wordmark strong { font-size: 25px; font-weight: 600; line-height: 1.1; letter-spacing: -.065em; }
.wordmark small { font-size: 10px; font-weight: 400; line-height: 1.4; letter-spacing: .035em; color: var(--muted); }
.site-header .wordmark { flex: none; gap: 2px; }
.site-header .wordmark strong { font-size: 22px; }
.site-header .wordmark small { font-size: 8.5px; letter-spacing: .025em; }
.desktop-nav { display: flex; align-items: center; gap: clamp(13px, 1.4vw, 24px); margin-left: auto; }
.nav-link, .reward-toggle { position: relative; display: inline-flex; align-items: center; gap: 5px; padding: 9px 0; font-size: 12px; font-weight: 500; white-space: nowrap; }
.nav-link:lang(th), .reward-toggle:lang(th) { font-size: 13px; }
.nav-link::after, .reward-toggle::after { position: absolute; content: ""; left: 0; right: 0; bottom: 7px; height: 1px; background: var(--teal-600); transform: scaleX(0); transform-origin: left; transition: transform .25s; }
.nav-link:hover::after, .nav-link[aria-current="page"]::after, .reward-toggle:hover::after, .reward-toggle[aria-expanded="true"]::after { transform: scaleX(1); }
.nav-link[aria-current="page"] { color: var(--teal-700); }
.reward-nav { position: relative; }
.reward-toggle svg { width: 12px; height: 12px; transition: transform .2s; }
.reward-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
.reward-menu { position: absolute; top: calc(100% + 10px); right: -24px; width: 244px; padding: 13px; background: white; border: 1px solid var(--line); box-shadow: 0 18px 50px rgba(0,70,61,.12); }
.reward-item { display: block; width: 100%; padding: 12px; font-size: 12px; text-align: left; }
.reward-item:hover { color: var(--teal-700); background: var(--teal-50); }
.header-actions { display: flex; align-items: center; gap: 12px; padding-left: 18px; border-left: 1px solid var(--line); }
.locale-switch { display: flex; align-items: center; gap: 9px; font-size: 10px; }
.locale-switch span { width: 1px; height: 11px; background: var(--line); }
.locale-switch button { min-height: 36px; min-width: 22px; padding: 9px 0; opacity: .5; font-size: 11px; font-weight: 500; }
.locale-switch button[aria-pressed="true"] { opacity: 1; color: var(--teal-700); font-weight: 700; }
.menu-toggle { display: none; padding: 8px; }
.menu-toggle svg { width: 24px; height: 24px; }
dialog { width: min(560px, calc(100% - 32px)); max-height: min(82vh, 760px); margin: auto; padding: 30px; color: var(--ink); border: 1px solid var(--line); background: var(--paper); box-shadow: 0 24px 75px #102f2b33; }
dialog::backdrop { background: rgba(0, 36, 31, .58); }
.dialog-close { display: grid; place-items: center; width: 34px; height: 34px; padding: 7px; }
.dialog-close:hover { background: var(--teal-50); }
.mobile-dialog { margin: 0 0 0 auto; width: min(390px, 100%); height: 100dvh; max-height: 100dvh; padding: 30px; border: 0; }
.mobile-dialog .dialog-close { position: absolute; top: 18px; right: 18px; }
.mobile-dialog .wordmark { margin-bottom: 33px; }
.mobile-links { display: flex; flex-direction: column; }
.mobile-links > .nav-link { padding: 13px 0; border-bottom: 1px solid var(--line); font-size: 16px; text-align: left; }
.mobile-links > .nav-link::after { right: auto; width: 28px; }
.mobile-reward { border-bottom: 1px solid var(--line); }
.mobile-reward summary { display: flex; align-items: center; justify-content: space-between; padding: 13px 0; cursor: pointer; list-style: none; font-size: 16px; }
.mobile-reward summary::-webkit-details-marker { display: none; }
.mobile-reward svg { width: 15px; height: 15px; }
.mobile-reward[open] svg { transform: rotate(180deg); }
.mobile-reward .reward-items { padding-bottom: 12px; }
.mobile-reward .reward-item { padding: 10px 10px 10px 16px; font-size: 13px; color: var(--muted); }
.mobile-dialog .locale-switch { margin-top: 24px; gap: 14px; }
.mobile-dialog .locale-switch button { font-size: 13px; }
.dialog-heading { display: flex; justify-content: space-between; align-items: start; gap: 12px; margin-bottom: 13px; }
.dialog-heading h2 { font-size: clamp(24px, 4vw, 36px); }
.dialog-body { color: var(--muted); font-size: 14px; }
.copy-status { min-height: 1.5em; margin-top: 8px; color: var(--teal-700); font-size: 13px; }

/* Full-viewport photography and the main site's scroll cue. */
.hero { position: relative; display: flex; align-items: center; min-height: calc(100svh - var(--header-h) - 1px); isolation: isolate; overflow: clip; color: white; background: var(--teal-700); }
.hero-media, .hero::after { position: absolute; inset: 0; }
.hero-media { z-index: -2; overflow: clip; }
.hero::after { content: ""; z-index: -1; background: linear-gradient(90deg, rgba(0,43,37,.8), rgba(0,67,56,.23) 77%), linear-gradient(0deg, rgba(0,42,36,.68), transparent 55%); }
.hero-image { position: absolute; top: -7%; left: 0; height: 114%; transform: translateY(var(--hero-offset, 0px)); }
.hero-content { padding-block: 78px 145px; }
.hero-content .eyebrow { color: var(--teal-100); margin-bottom: 29px; }
.hero-title { max-width: 980px; font-size: clamp(68px, 7.3vw, 118px); }
.hero-title span { display: block; }
.hero-title span:last-child { color: var(--teal-100); }
.hero-title:lang(th) { font-size: clamp(46px, 5.3vw, 76px); }
.hero-desc { max-width: 480px; margin-top: 24px; color: #ffffffe0; font-size: 15px; line-height: 1.9; }
.hero-jump { margin-top: 18px; border-bottom: 1px solid #ffffff75; }
.hero-bottom { position: absolute; inset: auto 0 35px; }
.hero-context { display: block; max-width: 235px; color: #ffffffcc; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
.hero-context:lang(th) { letter-spacing: .02em; font-size: 11px; }
.scroll-indicator { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 4px 10px; }
.scroll-indicator span { white-space: nowrap; text-transform: uppercase; font-size: 9px; letter-spacing: .16em; }
.scroll-indicator:lang(th) span { font-size: 11px; letter-spacing: .03em; }
.scroll-stem { position: relative; width: 1px; height: 40px; overflow: hidden; background: #ffffff51; }
.scroll-stem::after { content: ""; position: absolute; top: -18px; left: 0; width: 1px; height: 18px; background: var(--teal-100); animation: scroll-cue 2s ease-in-out infinite; }
@keyframes scroll-cue { 0% { transform: translateY(0); } 80%, 100% { transform: translateY(58px); } }

/* Research and journal content. */
.content-section { padding-block: clamp(58px, 7vw, 112px); }
.section-header { display: flex; justify-content: space-between; align-items: end; flex-wrap: wrap; gap: 14px 32px; margin-bottom: clamp(22px, 3.3vw, 42px); }
.section-header h2 { margin-top: 13px; font-size: clamp(38px, 5vw, 72px); }

function localized(value) {
  if (typeof value === 'string') return value;
  return value?.[language] || value?.en || value?.th || '';
}

function make(tag, className = '', value = '') {
  const element = document.createElement(tag);
  if (className) element.className = className;
  if (value) element.textContent = value;
  return element;
}

function icon(name) {
  const namespace = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(namespace, 'svg');
  svg.setAttribute('class', 'icon');
  svg.setAttribute('aria-hidden', 'true');
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '1.65');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  const use = document.createElementNS(namespace, 'use');
  use.setAttribute('href', `#i-${name}`);
  svg.append(use);
  return svg;
}

function button(label, className = 'quiet-button', iconName = '') {
  const control = make('button', className);
  control.type = 'button';
  if (iconName) control.append(icon(iconName));
  control.append(document.createTextNode(label));
  return control;
}

function setButton(control, label, iconName) {
  control.replaceChildren(icon(iconName), document.createTextNode(label));
}

function externalURL(raw) {
  if (!raw) return '';
  try {
    const url = new URL(raw);
    return url.protocol === 'https:' ? url.href : '';
  } catch (error) { return ''; }
}

function externalLink(label, raw, className = '', iconName = '') {
  const href = externalURL(raw);
  if (!href) return null;
  const link = make('a', className, label);
  link.href = href;
  link.target = '_blank';
  link.rel = 'noopener noreferrer';
  if (iconName) link.append(icon(iconName));
  return link;
}

function mediaURL(key) {
  if (typeof key !== 'string' || !key) return '';
  const source = content.media?.[key] || key;
  if (/^data:image\/(?:jpeg|png|webp|gif);base64,/i.test(source)) return source;
  try {
    const url = new URL(source, document.baseURI);
    if (url.protocol === 'https:' || url.origin === location.origin && url.protocol === 'http:') {
      return url.href;
    }
    if (url.protocol === 'file:' && location.protocol === 'file:') return url.href;
  } catch (error) {}
  return '';
}

function mediaImage(key, className = '', position = '') {
  const source = mediaURL(key);
  if (!source) return null;
  const img = make('img', className);
  img.alt = '';
  img.loading = 'lazy';
  img.decoding = 'async';
  if (position) img.style.objectPosition = position;
  img.src = source;
  return img;
}

function localURL(path) {
  const url = new URL(`../${path}`, document.baseURI);
  url.searchParams.set('lang', language);
  return url.href;
}

function pageURL(parameters, hash = '') {
  const url = new URL(window.ACLabSEOExport?.url || location.href);
  url.searchParams.set('lang', language);
  for (const [key, value] of Object.entries(parameters)) {
    if (value) url.searchParams.set(key, value);
    else url.searchParams.delete(key);
  }
  url.hash = hash;
  return url.href;
}

function updateQuery(parameters) {
  try { history.replaceState(null, '', pageURL(parameters, location.hash)); } catch (error) {}
}

function formatDate(value) {
  if (!/^\d{4}(?:-\d{2}){0,2}$/.test(value || '')) return '';
  if (value.length === 4) return value;
  const date = new Date(`${value.length === 7 ? `${value}-01` : value}T00:00:00Z`);
  if (Number.isNaN(date.getTime())) return '';
  const options = { year: 'numeric', month: 'short', timeZone: 'UTC' };
  if (value.length === 10) options.day = 'numeric';
  return new Intl.DateTimeFormat(language === 'th' ? 'th-TH-u-ca-gregory' : 'en-GB', options).format(date);
}

function searchTerms(value) {
  return value.normalize('NFKC').toLowerCase().trim().split(/\s+/).filter(Boolean);
}

function matchesTerms(value, terms) {
  const text = value.normalize('NFKC').toLowerCase();
  return terms.every(term => text.includes(term));
}

function updateOptions(select, choices, value) {
  const options = choices.map(([key, label]) => {
    const option = make('option', '', label);
    option.value = key;
    return option;
  });
  select.replaceChildren(...options);
  if (value && !choices.some(([key]) => key === value)) {
    const pendingOption = make('option', '', value);
    pendingOption.value = value;
    select.append(pendingOption);
  }
  select.value = value;
  if (select.selectedIndex < 0) select.selectedIndex = 0;
}

function pendingPage(name) {
  byId('pending-title').textContent = name;
  byId('pending-message').textContent = localized(sharedCopy.pending);
  byId('pending-dialog').showModal();
}

function closeReward() {
  const toggle = byId('reward-toggle');
  const menu = byId('reward-menu');
  if (toggle && menu) {
    toggle.setAttribute('aria-expanded', 'false');
    menu.hidden = true;
  }
}

function navItem(id, className = 'nav-link') {
  const route = routes[id];
  if (!route) return null;
  const label = localized(route.label);
  if (!route.enabled) {
    const control = button(label, className);
    control.addEventListener('click', () => {
      byId('mobile-menu').close();
      closeReward();
      pendingPage(label);
    });
    return control;
  }
  const link = make('a', className, label);
  link.href = localURL(route.url);
  if (id === sectionName) link.setAttribute('aria-current', 'page');
  return link;
}

function rewardNavigation(mobile) {
  const container = make(mobile ? 'details' : 'div', mobile ? 'mobile-reward' : 'reward-nav');
  const label = localized(routes.reward?.label) || 'Reward';
  const menu = make('div', mobile ? 'reward-items' : 'reward-menu');
  for (const id of ['funding', 'awards', 'patents']) {
    const item = navItem(id, 'reward-item');
    if (item) menu.append(item);
  }
  if (mobile) {
    const summary = make('summary', '', label);
    summary.append(icon('chevron'));
    container.append(summary, menu);
  } else {
    const toggle = button(label, 'reward-toggle');
    toggle.append(icon('chevron'));
    toggle.id = 'reward-toggle';
    menu.id = 'reward-menu';
    menu.hidden = true;
    toggle.setAttribute('aria-controls', menu.id);
    toggle.setAttribute('aria-expanded', 'false');
    toggle.addEventListener('click', () => {
      menu.hidden = !menu.hidden;
      toggle.setAttribute('aria-expanded', String(!menu.hidden));
    });
    container.append(toggle, menu);
  }
  return container;
}

function renderNavigation(id, mobile = false) {
  const navigation = byId(id);
  const order = ['about', 'team', 'publication', 'blog', 'reward', 'product', 'alumni', 'contact'];
  const items = order.map(route => route === 'reward' ? rewardNavigation(mobile) : navItem(route));
  navigation.replaceChildren(...items.filter(Boolean));
  navigation.setAttribute('aria-label', localized(sharedCopy.navigation));
}

function renderChrome() {
  document.documentElement.lang = language;
  byId('skip-link').textContent = localized(sharedCopy.skip);
  byId('home-link').href = localURL('index.html?view=main');
  byId('home-link').setAttribute('aria-label', `The AC Lab · ${localized(sharedCopy.home)}`);
  byId('footer-home').href = byId('home-link').href;
  byId('footer-home').replaceChildren(document.createTextNode(localized(sharedCopy.home)), icon('arrow'));
  for (const switcher of document.querySelectorAll('.locale-switch')) {
    switcher.setAttribute('aria-label', localized(sharedCopy.language));
  }
  for (const control of document.querySelectorAll('[data-language]')) {
    control.setAttribute('aria-pressed', String(control.dataset.language === language));
  }
  for (const control of document.querySelectorAll('[data-i18n-aria]')) {
    control.setAttribute('aria-label', localized(sharedCopy[control.dataset.i18nAria]));
  }
  for (const close of document.querySelectorAll('[data-dialog-close]')) {
    close.setAttribute('aria-label', localized(sharedCopy.close));
  }
  renderNavigation('desktop-nav');
  renderNavigation('mobile-links', true);
}

function renderHero(copy) {
  const img = byId('hero-image');
  const source = mediaURL(content.hero?.image);
  if (source && img.getAttribute('src') !== source) img.src = source;
  img.style.objectPosition = content.hero?.position || 'center';
  const heading = localized(copy.heroHeading).split('\n').map(line => make('span', '', line));
  byId('hero-title').replaceChildren(...heading);
  byId('hero-action').textContent = localized(copy.action);
  byId('hero-lede').textContent = localized(copy.lede);
  byId('hero-note').textContent = localized(copy.note);
  byId('scroll-label').textContent = localized(copy.scroll);
}

function setupEffects() {
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const hero = byId('cover');
  let frame = 0;
  function movePhoto() {
    frame = 0;
    if (reducedMotion.matches || hero.hidden) return;
    const bounds = hero.getBoundingClientRect();
    if (bounds.bottom < 0 || bounds.top > innerHeight) return;
    const shift = Math.max(0, byId('main').offsetTop - bounds.top) * .13;
    hero.style.setProperty('--hero-offset', `${Math.min(shift, bounds.height * .068)}px`);
  }
  window.addEventListener('scroll', () => {
    if (!frame) frame = requestAnimationFrame(movePhoto);
  }, { passive: true });

  if (!reducedMotion.matches && 'IntersectionObserver' in window) {
    const observer = new IntersectionObserver(entries => {
      for (const entry of entries) {
        if (!entry.isIntersecting) continue;
        entry.target.classList.remove('reveal-pending');
        entry.target.classList.add('reveal-visible');
        observer.unobserve(entry.target);
      }
    }, { threshold: .08 });
    for (const element of document.querySelectorAll('[data-reveal]')) {
      element.classList.add('reveal-pending');
      observer.observe(element);
    }
  }
}

const loadPublicData = window.ACLabData.load;

function initialize(render) {
  for (const placeholder of document.querySelectorAll('[data-icon]')) {
    placeholder.replaceChildren(icon(placeholder.dataset.icon));
  }
  for (const close of document.querySelectorAll('[data-dialog-close]')) {
    close.replaceChildren(icon('close'));
    close.addEventListener('click', () => close.closest('dialog').close());
  }
  const menu = byId('mobile-menu');
  const toggle = byId('open-menu');
  toggle.addEventListener('click', () => {
    menu.showModal();
    document.body.classList.add('menu-open');
    toggle.setAttribute('aria-expanded', 'true');
  });
  menu.querySelector('[data-close]').addEventListener('click', () => menu.close());
  menu.addEventListener('close', () => {
    document.body.classList.remove('menu-open');
    toggle.setAttribute('aria-expanded', 'false');
  });
  menu.addEventListener('click', event => {
    if (event.target !== menu) return;
    const bounds = menu.getBoundingClientRect();
    if (event.clientX < bounds.left || event.clientX > bounds.right) menu.close();
  });
  matchMedia('(max-width: 1040px)').addEventListener('change', event => {
    if (!event.matches && menu.open) menu.close();
  });
  document.addEventListener('click', event => {
    if (!event.target.closest('.reward-nav')) closeReward();
  });
  document.addEventListener('keydown', event => {
    if (event.key !== 'Escape' || byId('reward-menu').hidden) return;
    closeReward();
    byId('reward-toggle').focus();
  });
  for (const control of document.querySelectorAll('[data-language]')) {
    control.addEventListener('click', () => {
      language = control.dataset.language;
      try { localStorage.setItem('aclab.language', language); } catch (error) {}
      updateQuery({});
      renderChrome();
      render();
    });
  }
  renderChrome();
  render();
  setupEffects();

  if (location.protocol === 'file:') return;
  Promise.allSettled([loadPublicData(sectionName), loadPublicData('site')]).then(([page, site]) => {
    if (site.status === 'fulfilled' && site.value.routes) {
      routes = { ...routes, ...site.value.routes };
      renderChrome();
    }
    const recordsKey = sectionName === 'blog' ? 'posts' : 'papers';
    if (page.status === 'fulfilled' && Array.isArray(page.value[recordsKey])) {
      content = {
        ...embeddedContent, ...page.value,
        media: { ...embeddedContent.media, ...page.value.media },
      };
      render();
    }
  });
}

const pubText = key => localized(publicationCopy[key]);
const paperFilters = {
  search: (initialQuery.get('q') || '').slice(0, 160),
  year: /^\d{4}$/.test(initialQuery.get('year') || '') ? initialQuery.get('year') : '',
  topic: (initialQuery.get('topic') || '').slice(0, 80),
};
const PAPER_PAGE_SIZE = 8;
let paperLimit = PAPER_PAGE_SIZE;
const selectedPapers = new Set();

function doiURL(doi) {
  if (typeof doi !== 'string' || !/^10\.\d{4,9}\/\S+$/.test(doi)) return '';
  return `https://doi.org/${doi.split('/').map(encodeURIComponent).join('/')}`;
}

function paperTitleURL(paper) {
  return doiURL(paper.doi) || (/^\d+$/.test(paper.pmid || '') ? `https://pubmed.ncbi.nlm.nih.gov/${paper.pmid}/` : '');
}

function paperCitation(paper) {
  const authors = (paper.authors || []).join(', ');
  return [authors, paper.title, paper.journal, paper.reference, doiURL(paper.doi)]
    .filter(Boolean).map(value => value.replace(/\.$/, '')).join('. ');
}

function openCitations(papers) {
  byId('citation-text').value = papers.map(paperCitation).join('\n\n');
  byId('copy-status').textContent = '';
  byId('citation-dialog').showModal();
}

async function copyCitationText() {
  const field = byId('citation-text');
  try {
    await navigator.clipboard.writeText(field.value);
    byId('copy-status').textContent = pubText('copied');
  } catch (error) {
    field.focus();
    field.select();
    let copied = false;
    try { copied = document.execCommand?.('copy'); } catch (copyError) {}
    byId('copy-status').textContent = pubText(copied ? 'copied' : 'copyManual');
  }
}

function renderScope() {
  const covers = {
    genomics: 'specimen',
    phytochemistry: 'scope-chemistry',
    'cell-biology': 'scope-biomedical',
  };
  const tiles = content.topics.map(topic => {
    const tile = button('', 'scope-tile');
    tile.dataset.topic = topic.id;
    tile.setAttribute('aria-controls', 'paper-list');
    const badge = make('span', 'scope-icon');
    badge.append(icon(topic.icon || 'leaf'));
    const arrow = make('span', 'scope-arrow');
    arrow.append(icon('external'));
    const photo = mediaImage(covers[topic.id], 'scope-photo');
    if (photo) tile.append(photo);
    tile.append(badge, make('strong', 'display', localized(topic.name)), make('span', 'scope-summary', localized(topic.summary)), arrow);
    tile.addEventListener('click', () => {
      paperFilters.topic = paperFilters.topic === topic.id ? '' : topic.id;
      byId('paper-topic').value = paperFilters.topic;
      applyPaperFilters();
      byId('publications').scrollIntoView({ block: 'start' });
    });
    return tile;
  });
  byId('scope-grid').replaceChildren(...tiles);
}

function renderPaper(paper, index) {
  const row = make('li', 'paper-card');
  row.id = `paper-${paper.id}`;
  const rail = make('div', 'record-rail');
  const checkbox = make('input', 'record-check');
  checkbox.type = 'checkbox';
  checkbox.checked = selectedPapers.has(paper.id);
  checkbox.setAttribute('aria-label', `${aclabCopy('inline', {"label-1": {"th": "เลือกผลงาน", "en": "Select publication"}})['label-1'][language]} ${index + 1}`);
  checkbox.addEventListener('change', () => {
    if (checkbox.checked) selectedPapers.add(paper.id);
    else selectedPapers.delete(paper.id);
    updateSelection();
  });
  const cite = button(pubText('cite'), 'cite-button');
  cite.setAttribute('aria-label', `${pubText('cite')} ${index + 1}`);
  cite.addEventListener('click', () => openCitations([paper]));
  rail.append(checkbox, make('span', 'record-index', String(index + 1).padStart(2, '0')), cite);

  const columns = make('div', 'paper-columns');
  const detail = make('div', 'paper-detail');
  const tags = make('div', 'paper-tags');
  tags.append(make('span', 'chip year-chip', String(paper.year)));
  for (const topicId of paper.topics || []) {
    const topic = content.topics.find(item => item.id === topicId);
    if (topic) tags.append(make('span', 'chip', localized(topic.name)));
  }
  const heading = make('h3', 'display paper-title');
  heading.lang = 'en';
  const titleLink = externalLink(paper.title, paperTitleURL(paper));
  if (titleLink) heading.append(titleLink);
  else heading.textContent = paper.title;
  detail.append(tags, heading);
  if (paper.authors?.length) {
    const authors = make('p', 'paper-authors', paper.authors.join(', '));
    authors.lang = 'en';
    detail.append(authors);
  }

  const journal = make('p', 'paper-journal');
  journal.append(make('strong', '', paper.journal));
  if (paper.reference) journal.append(document.createTextNode(` · ${paper.reference}`));
  detail.append(journal);

  const identifiers = make('div', 'paper-identifiers');
  const date = formatDate(paper.date);
  if (date) {
    const time = make('time', '', date);
    time.dateTime = paper.date;
    identifiers.append(time);
  }
  const doi = externalLink(`DOI ${paper.doi}`, doiURL(paper.doi));
  if (doi) identifiers.append(doi);
  if (/^\d+$/.test(paper.pmid || '')) {
    identifiers.append(externalLink(`PMID ${paper.pmid}`, `https://pubmed.ncbi.nlm.nih.gov/${paper.pmid}/`));
  }
  const pmc = /^PMC\d+$/.test(paper.pmcid || '') ? `https://pmc.ncbi.nlm.nih.gov/articles/${paper.pmcid}/` : '';
  if (pmc) identifiers.append(make('span', 'chip open-label', pubText('openAccess')));
  detail.append(identifiers);
  if (localized(paper.summary)) detail.append(make('p', 'paper-summary', localized(paper.summary)));

  const actions = make('div', 'paper-actions');
  const pdf = externalLink(pubText('pdf'), paper.pdf, 'primary-button', 'file');
  const fullText = externalLink(pubText('fullText'), pmc, pdf ? 'quiet-button' : 'primary-button', 'external');
  const article = externalLink(pubText('article'), paperTitleURL(paper), pdf || fullText ? 'quiet-button' : 'primary-button', 'external');
  for (const link of [pdf, fullText, article]) {
    if (link) actions.append(link);
  }
  detail.append(actions);
  columns.append(detail);
  const photo = mediaImage(paper.cover);
  if (photo) {
    row.classList.add('is-featured');
    const figure = make('figure', 'paper-cover');
    figure.append(photo, make('figcaption', '', pubText('illustration')));
    columns.append(figure);
  }
  row.append(rail, columns);
  return row;
}

function updateSelection() {
  byId('selection-tools').hidden = selectedPapers.size === 0;
  byId('selection-count').textContent = aclabCopy('counters', {"selectionCount": {"th": "เลือก {count} รายการ", "en": "{count} selected"}}).selectionCount[language].replace('{count}', String(selectedPapers.size));
}

function renderPaperList() {
  const terms = searchTerms(paperFilters.search);
  const papers = [...content.papers].sort((a, b) => b.date.localeCompare(a.date));
  const matches = papers.filter(paper => {
    if (paperFilters.year && String(paper.year) !== paperFilters.year) return false;
    if (paperFilters.topic && !paper.topics.includes(paperFilters.topic)) return false;
    const haystack = [paper.title, paper.journal, paper.doi, paper.pmid, paper.year, ...paper.authors,
      paper.summary?.th, paper.summary?.en].join(' ');
    return matchesTerms(haystack, terms);
  });
  byId('paper-count').textContent = aclabCopy('counters', {"paperCount": {"th": "{count} ผลงาน", "en": "{count} publications"}}).paperCount[language].replace('{count}', String(matches.length));
  byId('paper-list').replaceChildren(...matches.slice(0, paperLimit).map(renderPaper));
  byId('paper-empty').hidden = matches.length !== 0;
  byId('paper-more-row').hidden = matches.length <= paperLimit;
  for (const tile of byId('scope-grid').children) {
    tile.setAttribute('aria-pressed', String(tile.dataset.topic === paperFilters.topic));
  }
  updateSelection();
}

function applyPaperFilters() {
  paperLimit = PAPER_PAGE_SIZE;
  updateQuery({ q: paperFilters.search, year: paperFilters.year, topic: paperFilters.topic });
  renderPaperList();
}

function clearPaperFilters() {
  paperFilters.search = '';
  paperFilters.year = '';
  paperFilters.topic = '';
  byId('paper-search').value = '';
  byId('paper-year').value = '';
  byId('paper-topic').value = '';
  applyPaperFilters();
}

function renderPublication() {
  document.title = `${pubText('title')} · The AC Lab`;
  renderHero(publicationCopy);
  const labels = {
    'scope-title': 'scope', 'scope-lede': 'scopeLede', 'catalog-title': 'catalog',
    'paper-search-label': 'search', 'paper-year-label': 'year', 'paper-topic-label': 'topic',
    'paper-order': 'order', 'paper-empty-title': 'emptyTitle', 'paper-empty-note': 'emptyNote',
    'citation-title': 'citations', 'bottom-note': 'bottom',
  };
  for (const [id, key] of Object.entries(labels)) byId(id).textContent = pubText(key);
  byId('about-link').href = localURL('about/index.html');
  byId('about-link').replaceChildren(document.createTextNode(pubText('about')), icon('external'));
  byId('bottom-link').href = localURL('blog/index.html');
  byId('bottom-link').replaceChildren(document.createTextNode('Lab Blog'), icon('arrow'));

  const years = [...new Set(content.papers.map(paper => String(paper.year)))].sort((a, b) => Number(b) - Number(a));
  updateOptions(byId('paper-year'), [['', pubText('allYears')], ...years.map(year => [year, year])], paperFilters.year);
  updateOptions(byId('paper-topic'), [['', pubText('allTopics')], ...content.topics.map(topic => [topic.id, localized(topic.name)])], paperFilters.topic);
  paperFilters.year = byId('paper-year').value;
  paperFilters.topic = byId('paper-topic').value;
  byId('paper-search').value = paperFilters.search;
  byId('paper-search').placeholder = pubText('searchHint');
  setButton(byId('paper-reset'), pubText('reset'), 'reset');
  setButton(byId('paper-empty-reset'), pubText('reset'), 'reset');
  setButton(byId('selected-citations'), pubText('citeSelected'), 'copy');
  byId('clear-selection').textContent = pubText('clearSelection');
  setButton(byId('copy-citation'), pubText('copy'), 'copy');
  setButton(byId('paper-more'), pubText('more'), 'down');
  renderScope();
  renderPaperList();
}

byId('paper-filters').addEventListener('submit', event => event.preventDefault());
byId('paper-search').addEventListener('input', event => {
  paperFilters.search = event.target.value;
  applyPaperFilters();
});
byId('paper-year').addEventListener('change', event => {
  paperFilters.year = event.target.value;
  applyPaperFilters();
});
byId('paper-topic').addEventListener('change', event => {
  paperFilters.topic = event.target.value;
  applyPaperFilters();
});
byId('paper-reset').addEventListener('click', clearPaperFilters);
byId('paper-empty-reset').addEventListener('click', clearPaperFilters);
byId('paper-more').addEventListener('click', () => {
  paperLimit += PAPER_PAGE_SIZE;
  renderPaperList();
});
byId('selected-citations').addEventListener('click', () => {
  openCitations(content.papers.filter(paper => selectedPapers.has(paper.id)));
});
byId('clear-selection').addEventListener('click', () => {
  selectedPapers.clear();
  renderPaperList();
});
byId('copy-citation').addEventListener('click', copyCitationText);

initialize(renderPublication);

})();
  </script>
</body>
</html>
