<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AC Lab — Plant Genomics to Medicine · Khon Kaen University</title>
<meta name="description" content="The AC Lab at Khon Kaen University sequences plant genomes, profiles medicinal-plant chemistry, and tests plant compounds on human cancer cells. Led by Prof. Dr. Arunrat Chaveerach.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%232f6b4f' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='8' stroke='%232f6b4f' stroke-width='1.4'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ============================================================
   AC LAB — Minimal edition
   ============================================================ */
:root{
  --bg:#f7f6f1;
  --surface:#ffffff;
  --surface-2:#f0eee7;
  --ink:#181d19;
  --muted:#6a706a;
  --faint:#9aa09a;
  --line:#e6e3da;
  --line-2:#dcd8cc;
  --accent:#2f6b4f;
  --accent-ink:#215339;
  --accent-soft:#e9f0eb;
  --accent-bright:#3f8a66;
  --ochre:#a9772a;

  --serif:"Fraunces","Noto Serif Thai",Georgia,serif;
  --sans:"Inter","IBM Plex Sans Thai",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;

  --r:18px;--r-sm:11px;
  --wrap:1180px;
  --hair:inset 0 0 0 1px var(--line);
  --lift:0 2px 4px rgba(24,29,25,.03), 0 26px 50px -34px rgba(24,29,25,.28);
  --ease:cubic-bezier(.22,.68,.2,1);
}
[data-theme="dark"]{
  --bg:#10140f;
  --surface:#171c16;
  --surface-2:#1c2219;
  --ink:#eef1ea;
  --muted:#a4ac9f;
  --faint:#6c746a;
  --line:#28301f;
  --line-2:#333c29;
  --accent:#5fa17f;
  --accent-ink:#8fc8a6;
  --accent-soft:#18251c;
  --accent-bright:#6fb48f;
  --ochre:#c99a4a;
  --hair:inset 0 0 0 1px var(--line);
  --lift:0 2px 4px rgba(0,0,0,.2), 0 30px 60px -34px rgba(0,0,0,.6);
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-weight:400;font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  transition:background .5s var(--ease),color .5s var(--ease);
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::selection{background:var(--accent);color:#fff}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:20px}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}

.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:clamp(20px,4vw,40px)}
.section{padding-block:clamp(64px,9vw,120px)}
.section--alt{background:var(--surface-2)}

/* type */
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);
  font-weight:500;display:inline-flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:22px;height:1px;background:currentColor;opacity:.6}
h1,h2,h3,h4{font-family:var(--serif);font-weight:400;line-height:1.06;letter-spacing:-.01em;margin:0}
.h-display{font-size:clamp(2.5rem,5.6vw,4.6rem);font-weight:300;line-height:1;letter-spacing:-.025em}
.h-sec{font-size:clamp(1.9rem,3.8vw,3.1rem);font-weight:400;letter-spacing:-.02em}
.lede{font-size:clamp(1.02rem,1.4vw,1.2rem);color:var(--muted);font-weight:300;line-height:1.6;max-width:58ch}
.mono{font-family:var(--mono)}
.sec-head{max-width:66ch;margin-bottom:clamp(38px,5vw,60px)}
.sec-head .h-sec{margin-top:16px}
.sec-head .lede{margin-top:18px}
.center{text-align:center;margin-inline:auto}
.center .eyebrow{justify-content:center}

.icon{width:1em;height:1em;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:10px;font-weight:500;font-size:.92rem;padding:13px 24px;border-radius:100px;
  transition:transform .4s var(--ease),background .3s,color .3s,box-shadow .3s;white-space:nowrap}
.btn .icon{font-size:1.05em;transition:transform .4s var(--ease)}
.btn:hover .icon{transform:translateX(3px)}
.btn--primary{background:var(--accent);color:#fff}
.btn--primary:hover{background:var(--accent-ink)}
.btn--ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.4px var(--line-2)}
.btn--ghost:hover{box-shadow:inset 0 0 0 1.4px var(--accent);color:var(--accent)}
.btn--sm{padding:10px 18px;font-size:.85rem}

.chip{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;letter-spacing:.05em;
  text-transform:uppercase;padding:6px 12px;border-radius:100px;color:var(--accent);background:var(--accent-soft)}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,138,102,.5)}70%{box-shadow:0 0 0 6px rgba(63,138,102,0)}100%{box-shadow:0 0 0 0 rgba(63,138,102,0)}}

/* ===== progress + nav ===== */
#progress{position:fixed;top:0;left:0;height:2px;width:0;background:var(--accent);z-index:1000;transition:width .1s}
.nav{position:fixed;top:0;left:0;width:100%;z-index:900;transition:background .4s,box-shadow .4s,backdrop-filter .4s}
.nav.scrolled{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--line)}
.nav__inner{display:flex;align-items:center;justify-content:space-between;height:72px}
.brand{display:flex;align-items:center;gap:12px}
.brand__mark{width:38px;height:38px}
.brand__name{font-family:var(--serif);font-weight:500;font-size:1.3rem;letter-spacing:-.02em;line-height:1}
.brand__sub{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.nav__links{display:flex;align-items:center;gap:2px}
.nav__links a{font-size:.88rem;font-weight:500;color:var(--muted);padding:8px 13px;border-radius:100px;transition:color .25s,background .25s;position:relative}
.nav__links a::after{content:"";position:absolute;left:13px;right:13px;bottom:3px;height:1.5px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .3s var(--ease)}
.nav__links a:hover{color:var(--ink)}
.nav__links a.active{color:var(--ink)}
.nav__links a.active::after{transform:scaleX(1)}
.nav__actions{display:flex;align-items:center;gap:8px}
.icon-toggle{width:40px;height:40px;border-radius:100px;display:inline-flex;align-items:center;justify-content:center;
  color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);font-size:17px;transition:.25s}
.icon-toggle:hover{color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.lang{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.04em;
  padding:8px 13px;border-radius:100px;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);transition:.25s}
.lang:hover{color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.lang .icon{font-size:14px}
.burger{display:none;width:42px;height:42px;border-radius:12px;align-items:center;justify-content:center;background:var(--ink);color:var(--bg);font-size:19px}

/* ===== responsive ===== */
@media(max-width:1024px){
  .nav__links{display:none}
  .burger{display:flex}
}
</style>
</head>
<body>

<!-- LOADING SCREEN -->
<div id="pre">
  <svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="21" stroke="var(--line-2)" stroke-width="3"/><circle class="rot" cx="24" cy="24" r="21" stroke="var(--accent)" stroke-width="3" stroke-dasharray="66,66" /></svg>
  <div class="lb">AC&nbsp;Lab</div>
</div>

<div id="progress"></div>

<!-- NAV -->
<header class="nav" id="nav">
  <div class="wrap nav__inner">
    <a href="#hero" class="brand">
      <span class="brand__mark"><svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18" stroke="var(--accent)" stroke-width="1.4"/><circle cx="20" cy="20" r="11.5" stroke="var(--accent)" stroke-width="1"/></svg></span>
      <span><span class="brand__name">AC Lab</span><span class="brand__sub">Genomics · KKU</span></span>
    </a>
    <nav class="nav__links" id="navLinks">
      <a href="#research">Research</a>
      <a href="#pipeline">Pipeline</a>
      <a href="#publications">Publications</a>
      <a href="#team">Team</a>
      <a href="#contact">Contact</a>
    </nav>
    <div class="nav__actions">
      <button class="icon-toggle" onclick="toggleTheme()"><svg class="icon"><use href="#i-moon"/></svg></button>
      <a href="#admin" class="btn btn--primary btn--sm" onclick="openAdmin(); return false;">Admin</a>
    </div>
  </div>
</header>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="admin">
  <div class="admin__scrim" onclick="closeAdmin()"></div>
  <div class="admin__panel">
    <div class="admin__bar">
      <div class="admin__brand">🔐 AC Lab Admin</div>
      <button onclick="closeAdmin()" style="width:40px;height:40px;border-radius:50%;background:var(--surface-2)">✕</button>
    </div>
    <div class="admin__lock" id="adminLock">
      <div class="lock-card">
        <div class="lk">🔒</div>
        <h3>Admin Access</h3>
        <p>Enter password to unlock</p>
        <input type="password" id="adminPass" placeholder="Password" style="width:100%;padding:12px;border-radius:10px;background:var(--surface);box-shadow:var(--hair);margin-bottom:12px">
        <button onclick="tryUnlock()" class="btn btn--primary">Unlock</button>
      </div>
    </div>
    <div id="adminBody" style="display:none;flex:1;overflow-y:auto;padding:20px">
      <h3>Manage Content</h3>
      <p>Admin panel ready. Edit and save changes.</p>
    </div>
  </div>
</div>

<main>
<!-- Placeholder sections - content will load from data or localStorage -->
<section id="hero" class="section" style="padding:120px 20px">
  <div class="wrap" style="text-align:center">
    <h1>AC Lab</h1>
    <p>Plant Genomics Research · Khon Kaen University</p>
  </div>
</section>

<section id="research" class="section"></section>
<section id="pipeline" class="section"></section>
<section id="publications" class="section"></section>
<section id="team" class="section"></section>
<section id="contact" class="section" style="padding:80px 20px">
  <div class="wrap" style="text-align:center">
    <h2>Contact</h2>
    <p>Faculty of Science, KKU</p>
  </div>
</section>
</main>

<div id="toasts"></div>

<!-- ICON SPRITE -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14A8 8 0 1 1 10 4a6 6 0 0 0 10 10Z"/></symbol>
</defs></svg>

<!-- Supabase library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// ===== Global state =====
let adminUnlocked = false;
let lang = 'en';
let MEMBERS = [];
let NEWS = [];
let CPUBS = [];
let PRODUCTS = [];
let VIDEOS = [];

// ===== UI helpers =====
function el(id){ return document.getElementById(id); }
function val(id){ return el(id)?.value || ''; }
function toggleTheme(){
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  localStorage.setItem('theme', html.getAttribute('data-theme'));
}
function toggleLang(){
  lang = lang === 'en' ? 'th' : 'en';
  localStorage.setItem('lang', lang);
  location.reload();
}
function toast(msg){
  const toasts = el('toasts');
  const t = document.createElement('div');
  t.className = 'toast show';
  t.textContent = msg;
  t.style.cssText = 'background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:100px;font-size:.9rem;margin-bottom:10px';
  toasts.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}
function openAdmin(){
  el('adminPanel').style.display = 'flex';
  el('adminPanel').classList.add('open');
}
function closeAdmin(){
  el('adminPanel').classList.remove('open');
  setTimeout(() => el('adminPanel').style.display = 'none', 300);
}
function tryUnlock(){
  const pass = val('adminPass');
  // Local fallback: check localStorage
  if(pass === 'admin123'){
    adminUnlocked = true;
    el('adminLock').style.display = 'none';
    el('adminBody').style.display = 'block';
    localStorage.setItem('adminUnlocked', '1');
    toast('Unlocked! Changes saved to browser.');
    return;
  }
  toast('Wrong password');
}
function openModal(id){
  el(id)?.classList.add('open');
}
function closeModal(id){
  el(id)?.classList.remove('open');
}

// ===== Save & Load =====
function saveStore(silent){
  const data = {
    members: MEMBERS,
    news: NEWS,
    cpubs: CPUBS,
    products: PRODUCTS,
    videos: VIDEOS,
    updated_at: new Date().toISOString()
  };
  localStorage.setItem('aclab_data', JSON.stringify(data));
  if(!silent) toast('✓ Saved to browser');
  return true;
}
function loadStore(){
  const stored = localStorage.getItem('aclab_data');
  if(stored){
    try {
      const data = JSON.parse(stored);
      MEMBERS = data.members || [];
      NEWS = data.news || [];
      CPUBS = data.cpubs || [];
      PRODUCTS = data.products || [];
      VIDEOS = data.videos || [];
    } catch(e) {
      console.error('Parse error:', e);
    }
  }
}

// ===== Supabase Cloud Sync (OPTIONAL) =====
const SUPA_URL = 'YOUR_SUPABASE_URL';  // Replace with your project URL
const SUPA_KEY = 'YOUR_ANON_KEY';      // Replace with anon public key
const ADMIN_EMAIL = 'admin@aclab.local'; // Your admin email

if(SUPA_URL.indexOf('YOUR_') < 0 && window.supabase){
  const supa = window.supabase.createClient(SUPA_URL, SUPA_KEY);
  
  // (1) Load from cloud
  supa.from('site_content').select('data').eq('id',1).single().then(({data,error})=>{
    if(error || !data || !data.data) return;
    const s = data.data;
    if(s.members) MEMBERS = s.members;
    if(s.news) NEWS = s.news;
    if(s.cpubs) CPUBS = s.cpubs;
    if(s.products) PRODUCTS = s.products;
    if(s.videos) VIDEOS = s.videos;
  });
  
  // (2) Override saveStore to sync to cloud
  const _saveStore = saveStore;
  saveStore = function(silent){
    const ok = _saveStore(silent);
    supa.from('site_content').update({
      data:{members:MEMBERS,news:NEWS,cpubs:CPUBS,products:PRODUCTS,videos:VIDEOS},
      updated_at: new Date()
    }).eq('id',1).then(({error})=>{
      if(error) toast('Cloud sync failed — check connection');
    });
    return ok;
  };
  
  // (3) Use Supabase auth
  window.tryUnlock = function(){
    supa.auth.signInWithPassword({email:ADMIN_EMAIL,password:val('adminPass')}).then(({error})=>{
      if(error){
        toast('Wrong password');
        return;
      }
      adminUnlocked = true;
      el('adminLock').style.display = 'none';
      el('adminBody').style.display = 'block';
      toast('✓ Signed in to Supabase');
    });
  };
  
  supa.auth.getSession().then(({data})=>{
    if(data && data.session) adminUnlocked = true;
  });
}

// ===== Init =====
window.addEventListener('DOMContentLoaded', () => {
  const theme = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', theme);
  lang = localStorage.getItem('lang') || 'en';
  
  loadStore();
  
  // Hide preloader
  const pre = el('pre');
  if(pre) {
    pre.style.opacity = '0';
    pre.style.pointerEvents = 'none';
    setTimeout(() => pre.remove(), 600);
  }
});

// ===== Check if unlocked on load =====
if(localStorage.getItem('adminUnlocked') === '1'){
  adminUnlocked = true;
}
</script>

<style>
.admin{position:fixed;inset:0;z-index:1500;display:flex}
.admin__scrim{position:absolute;inset:0;background:rgba(10,14,11,.5);backdrop-filter:blur(4px)}
.admin__panel{position:absolute;top:0;right:0;height:100%;width:min(400px,100%);background:var(--bg);box-shadow:-30px 0 80px -30px rgba(0,0,0,.5);display:flex;flex-direction:column;animation:slideIn .45s cubic-bezier(.22,.68,.2,1)}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.admin__bar{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
.admin__lock{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.lock-card{text-align:center;max-width:340px}
.lock-card h3{font-size:1.5rem;font-weight:500;margin:12px 0}
.lock-card p{color:var(--muted);margin:8px 0 16px;font-size:.9rem}
#pre{position:fixed;inset:0;z-index:2000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s;gap:20px;opacity:1;pointer-events:auto}
#pre svg{width:60px;height:60px}
#pre .lb{font-family:var(--serif);font-size:1.05rem;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:500}
#pre .rot{transform-origin:center;animation:spin 1.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#toasts{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:1400;display:flex;flex-direction:column;gap:9px;align-items:center}
.toast{opacity:0;transform:translateY(10px);transition:all .3s}
.toast.show{opacity:1;transform:none}
</style>

</body>
</html>
