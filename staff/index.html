<script>
(function(){
  const STYLE_ID='aw-notice-style';
  const HOST_ID='aw-notice-host';
  let loadingNode=null;
  let loadingTimer=null;
  function setup(){
    if(document.body && document.body.style.overflow==='hidden') document.body.style.overflow='';
    if(!document.getElementById(STYLE_ID)){
      const style=document.createElement('style');
      style.id=STYLE_ID;
      style.textContent=`
        #${HOST_ID}{position:fixed;z-index:2147483000;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));display:grid;gap:10px;width:min(420px,calc(100vw - 28px));pointer-events:none}
        .aw-notice{pointer-events:auto;display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:start;padding:13px 14px;border:1px solid #dfe4ef;border-radius:16px;background:rgba(255,255,255,.98);color:#17203a;box-shadow:0 18px 55px rgba(20,28,60,.20);animation:awNoticeIn .18s ease-out}
        .aw-notice.success{border-color:#cdeede}.aw-notice.error{border-color:#ffd1da}.aw-notice.info{border-color:#d7e5ff}.aw-notice.loading{border-color:#d8dafd}
        .aw-notice-icon{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:900;background:#eef0ff;color:#5557d9}
        .aw-notice.success .aw-notice-icon{background:#e8faf2;color:#08744f}.aw-notice.error .aw-notice-icon{background:#fff0f3;color:#b82d4b}.aw-notice.info .aw-notice-icon{background:#eef6ff;color:#315f8d}
        .aw-notice-copy b{display:block;font-size:13px}.aw-notice-copy span{display:block;margin-top:3px;color:#6f7992;font-size:11px;line-height:1.55;overflow-wrap:anywhere}
        .aw-notice-close{border:0;background:transparent;color:#8b94aa;font-size:18px;line-height:1;cursor:pointer;padding:2px}
        .aw-notice-spin{width:18px;height:18px;border:3px solid #d9dcfb;border-top-color:#5757df;border-radius:50%;animation:awNoticeSpin .75s linear infinite}
        @keyframes awNoticeSpin{to{transform:rotate(360deg)}}@keyframes awNoticeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
        @media(max-width:620px){#${HOST_ID}{left:10px;right:10px;top:max(10px,env(safe-area-inset-top));width:auto}.aw-notice{border-radius:14px}}
      `;
      document.head.appendChild(style);
    }
    let host=document.getElementById(HOST_ID);
    if(!host){host=document.createElement('div');host.id=HOST_ID;host.setAttribute('aria-live','polite');document.body.appendChild(host)}
    return host;
  }
  function remove(node){if(node?.isConnected)node.remove();if(node===loadingNode)loadingNode=null}
  function show(type,title,text='',duration=3500){
    const host=setup();
    const node=document.createElement('div');
    node.className=`aw-notice ${type}`;
    const icon=document.createElement('div');icon.className='aw-notice-icon';
    if(type==='loading'){const spin=document.createElement('i');spin.className='aw-notice-spin';icon.appendChild(spin)}
    else icon.textContent=type==='success'?'✓':type==='error'?'!':'i';
    const copy=document.createElement('div');copy.className='aw-notice-copy';
    const strong=document.createElement('b');strong.textContent=String(title||'');copy.appendChild(strong);
    if(text){const span=document.createElement('span');span.textContent=String(text);copy.appendChild(span)}
    const close=document.createElement('button');close.type='button';close.className='aw-notice-close';close.setAttribute('aria-label','ปิด');close.textContent='×';close.onclick=()=>remove(node);
    node.append(icon,copy,close);host.appendChild(node);
    if(duration>0)setTimeout(()=>remove(node),duration);
    return node;
  }
  function closeLoading(){clearTimeout(loadingTimer);loadingTimer=null;remove(loadingNode)}
  window.AWAlert={
    loading:(title='กำลังดำเนินการ',text='กรุณารอสักครู่')=>{closeLoading();loadingNode=show('loading',title,text,0);loadingTimer=setTimeout(()=>remove(loadingNode),30000);return Promise.resolve({isConfirmed:true})},
    close:()=>closeLoading(),
    success:(title='สำเร็จ',text='')=>{closeLoading();show('success',title,text,3800);return Promise.resolve({isConfirmed:true})},
    error:(title='เกิดข้อผิดพลาด',text='')=>{closeLoading();show('error',title,text,6500);return Promise.resolve({isConfirmed:true})},
    info:(title='แจ้งข้อมูล',text='')=>{closeLoading();show('info',title,text,4800);return Promise.resolve({isConfirmed:true})},
    confirm:(title,text='',confirmText='ยืนยัน')=>Promise.resolve({isConfirmed:window.confirm([title,text,`กด OK เพื่อ${confirmText}`].filter(Boolean).join('\n'))}),
    toast:(title,icon='success')=>{show(icon==='error'?'error':icon==='info'?'info':'success',title,'',icon==='error'?5500:3200);return Promise.resolve({isConfirmed:true})}
  };
  const boot=()=>setup();
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})();
</script>

<script type="module">

function topicsForCourse(id){return (S.data?.topics||[]).filter(t=>n(t.course_id)===n(id)).sort((a,b)=>n(a.sort_order)-n(b.sort_order)||n(a.id)-n(b.id))}
function assetsForTopic(id){return (S.data?.assets||[]).filter(a=>n(a.topic_id)===n(id)).sort((a,b)=>n(a.sort_order)-n(b.sort_order)||n(a.id)-n(b.id))}
function planInstallments(id){return (S.data?.installments||[]).filter(i=>i.payment_plan_id===id).sort((a,b)=>n(a.installment_no)-n(b.installment_no))}
function percent(used,total){return Math.max(0,Math.min(100,total?Math.round(n(used)/n(total)*100):0))}
function courseOptions(selected=""){return (S.data?.courses||[]).map(c=>`<option value="${c.id}" ${n(c.id)===n(selected)?"selected":""}>${esc(c.title)}</option>`).join("")}
function studentOptions(selected="",courseId=""){let rows=S.data?.students||[];if(courseId){const ids=new Set(enrollmentsForCourse(courseId).map(e=>n(e.student_id)));rows=rows.filter(s=>ids.has(n(s.id)))}return rows.map(s=>`<option value="${s.id}" ${n(s.id)===n(selected)?"selected":""}>${esc(full(s))} · ${esc(s.student_code||"")}</option>`).join("")}
function showModal(title,body,actions=""){modal.innerHTML=`<div class="modal"><div class="modal-head"><div><h3>${title}</h3></div><button class="btn ghost" data-close>✕</button></div><div class="modal-body">${body}</div><div class="modal-actions">${actions}</div></div>`;modal.classList.remove("hidden");$$("[data-close]",modal).forEach(b=>b.onclick=()=>modal.classList.add("hidden"))}
modal.addEventListener("click",e=>{if(e.target===modal)modal.classList.add("hidden")});
function authHtml(){return `<div class="auth"><section class="auth-hero"><div class="brand"><div class="logo">AW</div><div><strong>AreWarin Tutor Hub</strong><small>พื้นที่งานสอน ไม่ปะปนงานบริหาร</small></div></div><div class="auth-copy"><h1>สอนง่าย<br>ติดตามครบ</h1><p>เปิดคาบ เช็กชื่อ บันทึกหลังสอน ลงคลิปย้อนหลัง เพิ่มนักเรียนของตนเอง และเชื่อมต่อห้องสมุดจากหน้าจอเดียว</p></div><div class="brand"><small>แอดมินสร้างชื่อครูและ Tutor Code ได้ก่อน โดยไม่ต้องสร้าง Auth user เอง</small></div></section><section class="auth-panel"><div class="auth-card"><h2>${S.authMode==="register"?"เปิดบัญชีติวเตอร์":S.authMode==="reset"?"กู้รหัสผ่านติวเตอร์":"เข้าสู่ระบบผู้สอน"}</h2><p>${S.authMode==="login"?"ใช้อีเมลหรือ Tutor Code ที่สถาบันออกให้":"กรอกข้อมูลให้ตรงกับรายชื่อครูในระบบหลัก"}</p><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#f0f2fa;padding:4px;border-radius:13px;margin:15px 0"><button class="btn ${S.authMode==="login"?"primary":"ghost"}" data-auth-mode="login">เข้าสู่ระบบ</button><button class="btn ${S.authMode==="register"?"primary":"ghost"}" data-auth-mode="register">เปิดบัญชี</button><button class="btn ${S.authMode==="reset"?"primary":"ghost"}" data-auth-mode="reset">ลืมรหัส</button></div><div id="auth-message"></div>${S.authMode==="login"?`<form id="login"><div class="field"><label>อีเมล หรือ Tutor Code</label><input class="input" name="identifier" required autocomplete="username" placeholder="เช่น TUT2601001"></div><div class="field"><label>รหัสผ่าน</label><input class="input" type="password" name="password" required autocomplete="current-password"></div><button class="btn primary wide">เข้าสู่ Tutor Hub</button></form>`:S.authMode==="register"?`<form id="tutor-register"><div class="field"><label>Tutor Code</label><input class="input" name="tutor_code" required placeholder="รหัสที่แอดมินสร้างให้"></div><div class="field"><label>อีเมล</label><input class="input" type="email" name="email" required></div><div class="field"><label>เบอร์โทร</label><input class="input" name="phone" required></div><div class="field"><label>รหัสผ่านใหม่</label><input class="input" type="password" name="password" required minlength="8"></div><div class="field"><label>ยืนยันรหัสผ่าน</label><input class="input" type="password" name="confirm_password" required></div><div class="field"><label>PIN 4 หลัก สำหรับกู้รหัส</label><input class="input" name="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required></div><button class="btn primary wide">สร้างบัญชีและเข้าสู่ระบบ</button></form>`:`<form id="tutor-reset"><div class="field"><label>Tutor Code</label><input class="input" name="tutor_code" required></div><div class="field"><label>อีเมล</label><input class="input" type="email" name="email" required></div><div class="field"><label>PIN 4 หลัก</label><input class="input" name="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required></div><div class="field"><label>รหัสผ่านใหม่</label><input class="input" type="password" name="new_password" required minlength="8"></div><div class="field"><label>ยืนยันรหัสผ่านใหม่</label><input class="input" type="password" name="confirm_password" required></div><button class="btn primary wide">เปลี่ยนรหัสผ่าน</button></form>`}<div class="message" style="margin-top:14px;margin-bottom:0">ยังไม่มี Tutor Code ให้ติดต่อแอดมินเพิ่มชื่อครูและวิชาจากระบบหลักก่อน</div></div></section></div>`}
const NAV=[
["dashboard","◈","ภาพรวม"],["schedule","◷","ตารางสอน"],["attendance","✓","เปิดคาบและเช็กชื่อ"],["students","◎","นักเรียนของฉัน"],["notes","✎","บันทึกหลังสอน"],["learning","▶","เรียนย้อนหลัง"],["progress","◔","ความคืบหน้า"],["payments","฿","แผนชำระเงิน"],["course_requests","＋","ขอเปิดคอร์ส"],["import","⇩","นำเข้า CSV"],["notifications","●","แจ้งเตือน"],["profile","⚙","โปรไฟล์ของฉัน"]
];
function title(){return ({dashboard:"ภาพรวมการสอน",schedule:"ตารางสอนของฉัน",attendance:"เปิดคาบและเช็กชื่อ",students:"นักเรียนของฉัน",notes:"บันทึกหลังสอน",learning:"คอร์สเรียนย้อนหลัง",progress:"ความคืบหน้านักเรียน",payments:"แบ่งชำระและผ่อนจ่าย",course_requests:"ขอเปิดคอร์สใหม่",import:"นำเข้าข้อมูลการเรียน",notifications:"การแจ้งเตือน",profile:"โปรไฟล์ผู้สอน"})[S.tab]||"Tutor Hub"}
function shell(content){const unread=(S.data.notifications||[]).filter(x=>!x.is_read).length,tutorCode=S.data.tutor_code||S.data.profile.tutor_code||"";return `<div class="shell"><aside class="side"><div class="brand"><div class="logo">AW</div><div><strong>Tutor Hub V11</strong><small>Teaching workspace</small></div></div><div class="profile-mini"><b>${esc(S.data.profile.display_name||"ผู้สอน")}</b><span>${S.data.is_admin?"Admin · โหมดงานสอน":`Tutor · ${esc(tutorCode||"รอรหัสติวเตอร์")}`}</span>${S.data.tutor?.primary_subject?`<span style="display:block;margin-top:4px">${esc(S.data.tutor.primary_subject)}</span>`:""}</div><nav class="nav">${NAV.map(([id,icon,label])=>`<button class="${S.tab===id?"active":""}" data-tab="${id}"><span>${icon}</span><span>${label}</span>${id==="notifications"&&unread?`<span class="badge">${unread}</span>`:""}</button>`).join("")}</nav><div class="side-foot"><a class="btn ghost wide" href="../library/" style="display:block;text-decoration:none;text-align:center;margin-bottom:8px">📚 ห้องสมุด</a><button class="btn ghost wide" data-logout>ออกจากระบบ</button></div></aside><main class="main"><header class="top"><div><h1>${title()}</h1><p>${new Intl.DateTimeFormat("th-TH",{dateStyle:"full"}).format(new Date())}</p></div><div class="top-actions"><a class="btn" href="../library/" style="text-decoration:none">Library</a><button class="btn" data-refresh>รีเฟรช</button><button class="btn primary" data-quick-session>+ เปิดคาบ</button></div></header><div class="content">${content}</div></main></div>`}
function dashboardHtml(){const today=new Date().toISOString().slice(0,10),todayEvents=(S.data.schedule||[]).filter(e=>e.event_date===today&&e.status!=="cancelled"),activeStudents=(S.data.students||[]).length,openSessions=(S.data.sessions||[]).filter(s=>s.status==="open").length,unread=(S.data.notifications||[]).filter(x=>!x.is_read).length,near=[];for(const e of S.data.enrollments||[]){const left=n(e.hours_total)-n(e.hours_used);if(left<=3&&left>=0)near.push({e,left})}const missingNotes=(S.data.sessions||[]).filter(s=>s.status==="closed"&&!S.data.teaching_notes.some(x=>x.session_id===s.id)).slice(0,5);const tasks=[...todayEvents.filter(e=>e.status==="scheduled").map(e=>({text:`มีคาบ ${e.title} เวลา ${e.start_time?.slice(0,5)||"-"}`,kind:"schedule"})),...missingNotes.map(s=>({text:`ยังไม่มีบันทึกหลังสอน: ${s.title}`,kind:"note"})),...near.slice(0,5).map(x=>({text:`${full(student(x.e.student_id))} เหลือ ${x.left} ชม.`,kind:"hours"}))].slice(0,8);return `<div class="grid dashboard-split"><section class="card hero"><span class="chip" style="background:rgba(255,255,255,.14);color:#fff">Tutor workspace</span><h2>สวัสดี ${esc(S.data.profile.display_name||"คุณครู")}</h2><p>วันนี้มี ${todayEvents.length} คาบ · ดูแลนักเรียน ${activeStudents} คน · เปิดค้าง ${openSessions} คาบ</p><div class="quick-grid"><button class="quick" data-go="schedule"><b>＋ เพิ่มตารางสอน</b><span>สร้างนัดหมายรายครั้งหรือทำซ้ำ</span></button><button class="quick" data-go="attendance"><b>✓ เปิดคาบเรียน</b><span>เช็กชื่อและลงชั่วโมง</span></button><button class="quick" data-add-student><b>◎ เพิ่มนักเรียน</b><span>ค้นหาเบอร์หรือสร้างใหม่</span></button><button class="quick" data-go="learning"><b>▶ ลงคลิปย้อนหลัง</b><span>YouTube วิดีโอ และชีท</span></button></div></section><section class="card"><div class="section-head"><div><h2>งานที่ต้องทำ</h2><p>ระบบสรุปจากตารางและข้อมูลการสอน</p></div><span class="chip amber">${tasks.length} รายการ</span></div>${tasks.length?tasks.map(t=>`<div class="task"><span class="dot"></span><div><b>${esc(t.text)}</b><div class="sub">${t.kind==="note"?"เพิ่มบันทึกหลังสอน":"ตรวจสอบและดำเนินการ"}</div></div></div>`).join(""):'<div class="empty">ไม่มีงานเร่งด่วน</div>'}</section></div><div class="grid metrics" style="margin-top:16px"><div class="card metric"><small>นักเรียนในความดูแล</small><strong>${activeStudents}</strong><div class="trend">ตามสิทธิ์ผู้สอน</div></div><div class="card metric"><small>คาบวันนี้</small><strong>${todayEvents.length}</strong><div class="trend">ตารางส่วนตัว</div></div><div class="card metric"><small>ใกล้หมดชั่วโมง</small><strong>${near.length}</strong><div class="trend" style="color:var(--amber)">เหลือไม่เกิน 3 ชั่วโมง</div></div><div class="card metric"><small>แจ้งเตือนใหม่</small><strong>${unread}</strong><div class="trend">จากนักเรียนและระบบ</div></div></div><section class="card" style="margin-top:16px"><div class="section-head"><div><h2>คาบเรียนวันนี้</h2><p>กดเปิดคาบจากตารางได้ทันที</p></div><button class="btn primary" data-new-schedule>+ เพิ่มตาราง</button></div>${todayEvents.length?`<div class="calendar-grid">${todayEvents.map(eventCard).join("")}</div>`:'<div class="empty">วันนี้ยังไม่มีตารางสอน</div>'}</section>`}
function eventCard(e){const c=course(e.course_id),st=e.status;return `<article class="event"><div class="section-head"><div><div class="event-time">${esc((e.start_time||"").slice(0,5))}–${esc((e.end_time||"").slice(0,5)||"-")}</div><h2>${esc(e.title)}</h2><p>${esc(c?.title||"")} ${e.student_id?`· ${esc(full(student(e.student_id)))}`:"· ทั้งกลุ่ม"}</p></div><span class="chip ${st==="closed"?"green":st==="cancelled"?"red":st==="open"?"amber":"gray"}">${({scheduled:"รอสอน",open:"กำลังสอน",closed:"จบแล้ว",cancelled:"ยกเลิก"})[st]||st}</span></div><div class="sub">${esc(e.delivery_mode)} · ${esc(e.location_or_link||"ไม่ระบุลิงก์/สถานที่")} · ${n(e.session_hours)} ชม.</div><div class="toolbar" style="margin-top:12px">${st==="scheduled"?`<button class="btn primary small" data-start-schedule="${e.id}">เปิดคาบ</button><button class="btn danger small" data-cancel-schedule="${e.id}">ยกเลิก</button>`:""}${st==="open"&&e.attendance_session_id?`<button class="btn success small" data-roster="${e.attendance_session_id}">เช็กชื่อ</button>`:""}</div></article>`}
function scheduleHtml(){let rows=S.data.schedule||[];return `<section class="card"><div class="section-head"><div><h2>ปฏิทินและตารางสอนส่วนตัว</h2><p>ติวเตอร์เห็นเฉพาะตารางของตนเอง</p></div><button class="btn primary" data-new-schedule>+ เพิ่มตารางสอน</button></div><div class="toolbar"><input class="input" id="schedule-search" placeholder="ค้นหาชื่อคาบหรือคอร์ส" style="max-width:360px"></div>${rows.length?`<div class="calendar-grid" id="schedule-list">${rows.map(eventCard).join("")}</div>`:'<div class="empty">ยังไม่มีตารางสอน</div>'}</section>`}
function attendanceHtml(){const sessions=(S.data.sessions||[]).filter(s=>["open","closed"].includes(s.status));return `<section class="card"><div class="section-head"><div><h2>คาบเรียนและการลงเวลา</h2><p>ผู้สอนเป็นผู้เช็กชื่อ นักเรียนดูผลอย่างเดียว</p></div><button class="btn primary" data-open-session>+ เปิดคาบทันที</button></div>${sessions.length?`<div class="session-grid">${sessions.map(s=>{const c=course(s.course_id),count=(S.data.attendance||[]).filter(a=>a.session_id===s.id).length;return `<article class="session"><div class="section-head"><div><span class="chip ${s.status==="closed"?"green":"amber"}">${s.status==="closed"?"ปิดคาบแล้ว":"เปิดอยู่"}</span><h2 style="margin-top:8px">${esc(s.title)}</h2><p>${esc(c?.title||"")} · ${date(s.session_date)} · ${n(s.session_hours)||"-"} ชม.</p></div><b>${count} คน</b></div><div class="toolbar"><button class="btn primary small" data-roster="${s.id}">เปิดรายชื่อ</button>${s.status==="open"?`<button class="btn success small" data-finalize="${s.id}">จบคาบและลงชั่วโมง</button>`:`<button class="btn small" data-note-session="${s.id}">บันทึกหลังสอน</button>`}</div></article>`}).join("")}</div>`:'<div class="empty">ยังไม่มีคาบเรียน</div>'}</section>`}
function studentsHtml(){let rows=(S.data.students||[]).filter(s=>!S.search||full(s).toLowerCase().includes(S.search.toLowerCase())||String(s.student_code||"").toLowerCase().includes(S.search.toLowerCase()));return `<section class="card"><div class="section-head"><div><h2>นักเรียนที่ฉันสอน</h2><p>ข้อมูลถูกกรองตามการมอบหมายทั้งรายคนและรายคอร์ส</p></div><button class="btn primary" data-add-student>+ เพิ่มนักเรียน</button></div><div class="toolbar"><input class="input" id="student-search" value="${esc(S.search)}" placeholder="ค้นหาชื่อหรือรหัสนักเรียน" style="max-width:380px"><button class="btn" data-go="import">นำเข้า CSV</button></div>${rows.length?`<div class="grid student-grid">${rows.map(s=>{const es=enrollmentsForStudent(s.id),total=es.reduce((a,e)=>a+n(e.hours_total),0),used=es.reduce((a,e)=>a+n(e.hours_used),0),left=Math.max(0,total-used);return `<article class="card student-card"><div class="student-head"><div class="avatar">${esc(initials(s))}</div><div><div class="name">${esc(full(s))}</div><div class="sub">${esc(s.student_code||"ไม่มีรหัส")} · ${esc(s.school||"ไม่ระบุโรงเรียน")}</div></div></div><div><div class="hours"><span>ใช้ไป ${used} ชม.</span><span>เหลือ ${left} ชม.</span></div><div class="progress"><i style="width:${percent(used,total)}%"></i></div></div><div class="sub">คอร์ส: ${es.map(e=>course(e.course_id)?.title).filter(Boolean).map(esc).join(", ")||"ยังไม่มีคอร์ส"}</div><div class="toolbar"><button class="btn small" data-student-detail="${s.id}">ดูข้อมูล</button><button class="btn primary small" data-new-note="${s.id}">บันทึกหลังสอน</button><button class="btn warn small" data-new-plan="${s.id}">ออกแผนชำระ</button></div></article>`}).join("")}</div>`:'<div class="empty">ไม่พบนักเรียน</div>'}</section>`}
function notesHtml(){const rows=S.data.teaching_notes||[];return `<section class="card"><div class="section-head"><div><h2>บันทึกหลังสอน</h2><p>เลือกให้แสดงนักเรียนเห็นหรือเก็บเฉพาะผู้สอน</p></div><button class="btn primary" data-new-note>+ เพิ่มบันทึก</button></div>${rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>วันที่</th><th>นักเรียน</th><th>คอร์ส/หัวข้อ</th><th>สรุป</th><th>การมองเห็น</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${date(x.lesson_date)}</td><td><div class="name">${esc(full(student(x.student_id)))}</div></td><td>${esc(course(x.course_id)?.title||"")}<div class="sub">${esc(x.topic||"")}</div></td><td>${esc(x.lesson_summary||"-")}<div class="sub">ทบทวน: ${esc(x.review_points||"-")}</div></td><td><span class="chip ${x.visibility==="student"?"green":"gray"}">${x.visibility==="student"?"นักเรียนเห็น":"เฉพาะ Staff"}</span></td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">ยังไม่มีบันทึกหลังสอน</div>'}</section>`}
function learningHtml(){return `<section class="card"><div class="section-head"><div><h2>คอร์สและบทเรียนย้อนหลัง</h2><p>เพิ่มภาพปก หัวข้อ YouTube วิดีโอ ชีท และมอบหมายรายคน/ทั้งคอร์ส</p></div><button class="btn primary" data-new-topic>+ เพิ่มบทเรียน</button></div><div class="grid course-grid">${(S.data.courses||[]).map(c=>{const ts=topicsForCourse(c.id),as=ts.flatMap(t=>assetsForTopic(t.id));return `<article class="card course"><div class="cover" style="${c.cover_url?`background-image:url('${esc(c.cover_url)}')`:""}"><b>${esc(c.title)}</b></div><div class="course-body"><div class="section-head"><div><span class="chip">${ts.length} บท</span><p>${as.length} สื่อ</p></div><button class="btn small" data-course-settings="${c.id}">ภาพปก</button></div><div class="toolbar"><button class="btn primary small" data-new-topic-course="${c.id}">+ หัวข้อ</button><button class="btn small" data-new-code-course="${c.id}">+ รหัสคอร์ส</button></div>${ts.slice(0,5).map(t=>`<div class="lesson"><div class="section-head"><div><b>${esc(t.title)}</b><div class="sub">${t.is_published?"เผยแพร่":"ซ่อน"} · ${assetsForTopic(t.id).length} สื่อ</div></div><button class="btn small" data-add-asset="${t.id}">+ สื่อ</button></div>${assetsForTopic(t.id).slice(0,3).map(a=>`<div class="asset"><div><b>${esc(a.title)}</b><div class="sub">${esc(a.asset_type)}</div></div><button class="btn small" data-open-asset="${a.id}">เปิด</button></div>`).join("")}</div>`).join("")||'<div class="empty">ยังไม่มีบทเรียน</div>'}</div></article>`}).join("")}</div></section>`}
function progressHtml(){const rows=[];for(const s of S.data.students||[]){for(const e of enrollmentsForStudent(s.id)){const ts=topicsForCourse(e.course_id),done=ts.filter(t=>(S.data.progress||[]).some(p=>n(p.student_id)===n(s.id)&&n(p.topic_id)===n(t.id)&&p.status==="completed")).length;rows.push({s,e,total:ts.length,done,pct:ts.length?Math.round(done/ts.length*100):0,last:(S.data.progress||[]).filter(p=>n(p.student_id)===n(s.id)&&ts.some(t=>n(t.id)===n(p.topic_id))).sort((a,b)=>new Date(b.last_opened_at)-new Date(a.last_opened_at))[0]})}}return `<section class="card"><div class="section-head"><div><h2>ความคืบหน้าคอร์สย้อนหลัง</h2><p>ดูว่าใครเรียนจบกี่บทและเปิดล่าสุดเมื่อใด</p></div></div>${rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>นักเรียน</th><th>คอร์ส</th><th>เรียนแล้ว</th><th>ความคืบหน้า</th><th>ล่าสุด</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="name">${esc(full(r.s))}</td><td>${esc(course(r.e.course_id)?.title||"")}</td><td>${r.done}/${r.total}</td><td><div class="progress" style="min-width:140px"><i style="width:${r.pct}%"></i></div><div class="sub">${r.pct}%</div></td><td>${r.last?dt(r.last.last_opened_at):"ยังไม่เริ่ม"}</td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">ยังไม่มีข้อมูลความคืบหน้า</div>'}</section>`}
function paymentsHtml(){const plans=S.data.payment_plans||[];return `<section class="card"><div class="section-head"><div><h2>แผนแบ่งชำระและผ่อนจ่าย</h2><p>ติวเตอร์กำหนดยอดรวม ยอดที่จ่ายมาแล้ว จำนวนงวด และวันครบกำหนดได้ โดยการอนุมัติสลิปเป็นงานของแอดมิน</p></div><button class="btn primary" data-new-plan>+ สร้างแผนชำระ</button></div>${plans.length?`<div class="grid plan-grid">${plans.map(p=>{const st=planInstallments(p.id),pct=percent(p.amount_paid,p.total_amount);return `<article class="card plan"><div class="section-head"><div><span class="chip ${p.status==="paid"?"green":"amber"}">${p.status==="paid"?"ชำระครบ":"กำลังผ่อน"}</span><h2 style="margin-top:8px">${esc(p.title)}</h2><p>${esc(full(student(p.student_id)))} · ${esc(course(p.course_id)?.title||"ไม่ระบุคอร์ส")}</p></div><b>${money(p.balance_amount)}<div class="sub">คงเหลือ</div></b></div><div class="money-row"><span>ยอดรวม ${money(p.total_amount)}</span><span>รับแล้ว ${money(p.amount_paid)}</span></div><div class="progress" style="margin:10px 0"><i style="width:${pct}%"></i></div>${st.map(i=>`<div class="installment"><b>${i.installment_no}</b><div><div>ครบกำหนด ${date(i.due_date)}</div><div class="sub">${money(i.amount_paid)} / ${money(i.amount_due)}</div></div><span class="chip ${i.status==="paid"?"green":i.status==="partial"?"amber":i.status==="overdue"?"red":"gray"}">${({paid:"ครบ",partial:"บางส่วน",overdue:"เลยกำหนด",pending:"รอชำระ"})[i.status]||i.status}</span></div>`).join("")}</article>`}).join("")}</div>`:'<div class="empty">ยังไม่มีแผนชำระเงิน</div>'}</section>`}
function importHtml(){return `<section class="card"><div class="section-head"><div><h2>นำเข้าข้อมูลการเรียนจาก CSV</h2><p>รองรับ student_code หรือ phone เพื่อค้นหานักเรียน และ course_id หรือ course_title เพื่อค้นหาคอร์ส</p></div><a class="btn" href="../templates/learning-import-template.csv" download>ดาวน์โหลดตัวอย่าง CSV</a></div><div class="message">คอลัมน์: student_code, phone, course_id, course_title, lesson_date, topic, hours, attendance_status, notes, source_key</div><div class="field"><label>เลือกไฟล์ CSV (UTF-8)</label><input class="input" id="csv-file" type="file" accept=".csv,text/csv"></div><div class="toolbar"><button class="btn primary" data-parse-csv>อ่านไฟล์</button><button class="btn success" data-import-csv ${S.csvRows.length?"":"disabled"}>นำเข้า ${S.csvRows.length||0} แถว</button></div><div id="csv-preview">${S.csvRows.length?csvPreview(S.csvRows):'<div class="empty">ยังไม่ได้เลือกไฟล์</div>'}</div></section>`}
function csvPreview(rows){return `<div class="csv-preview"><table class="table"><thead><tr>${Object.keys(rows[0]||{}).map(k=>`<th>${esc(k)}</th>`).join("")}</tr></thead><tbody>${rows.slice(0,50).map(r=>`<tr>${Object.keys(rows[0]||{}).map(k=>`<td>${esc(r[k])}</td>`).join("")}</tr>`).join("")}</tbody></table></div><div class="sub" style="margin-top:8px">แสดง 50 แถวแรก จากทั้งหมด ${rows.length} แถว</div>`}
function notificationsHtml(){const rows=S.data.notifications||[];return `<section class="card"><div class="section-head"><div><h2>แจ้งเตือนงานสอน</h2><p>นักเรียนใหม่ สลิป บทเรียน ตาราง และประกาศ</p></div></div>${rows.length?rows.map(x=>`<div class="notify ${x.is_read?"":"unread"}"><div class="section-head"><div><b>${esc(x.title)}</b><div class="sub">${dt(x.created_at)}</div></div>${x.is_read?'':'<button class="btn small" data-read="'+x.id+'">อ่านแล้ว</button>'}</div><div>${esc(x.body||"")}</div></div>`).join(""):'<div class="empty">ไม่มีแจ้งเตือน</div>'}</section>`}
function profileHtml(){const p=S.data.profile;return `<section class="card" style="max-width:900px"><div class="section-head"><div><h2>โปรไฟล์ผู้สอน</h2><p>ข้อมูลนี้ใช้ใน Tutor Hub และหน้าที่เกี่ยวข้องกับการสอน</p></div></div><form id="profile-form"><div class="form-grid"><div class="field"><label>ชื่อที่แสดง</label><input class="input" name="display_name" value="${esc(p.display_name||"")}" required></div><div class="field"><label>เบอร์โทร</label><input class="input" name="phone" value="${esc(p.phone||"")}"></div><div class="field wide"><label>สาขาที่ถนัด</label><input class="input" name="specialties" value="${esc(p.specialties||"")}" placeholder="เช่น ชีววิทยา ม.ปลาย, สอวน."></div><div class="field wide"><label>รูปโปรไฟล์ URL</label><input class="input" type="url" name="avatar_url" value="${esc(p.avatar_url||"")}"></div><div class="field wide"><label>แนะนำตัว</label><textarea class="textarea" rows="5" name="bio">${esc(p.bio||"")}</textarea></div></div><button class="btn primary">บันทึกโปรไฟล์</button></form></section>`}

function courseRequestsHtml(){const rows=S.data.course_requests||[];return `<section class="card"><div class="section-head"><div><h2>ขอเปิดคอร์สใหม่</h2><p>ติวเตอร์ส่งรายละเอียดให้แอดมินตรวจ คอร์สจะยังไม่แสดงให้นักเรียนเห็นจนกว่าจะได้รับอนุมัติ</p></div><button class="btn primary" data-request-course>+ ส่งคำขอเปิดคอร์ส</button></div><div class="message">เมื่อแอดมินอนุมัติ คอร์สจะถูกสร้างในระบบหลัก มอบหมายให้คุณ และปรากฏในฟอร์มเพิ่มนักเรียน/ลงวิดีโอย้อนหลังอัตโนมัติ</div>${rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>วันที่</th><th>ชื่อคอร์ส</th><th>ชั่วโมง/ราคา</th><th>รูปแบบ</th><th>สถานะ</th><th>หมายเหตุแอดมิน</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${date(r.created_at)}</td><td><b>${esc(r.title)}</b><div class="sub">${esc(r.description||"")}</div></td><td>${n(r.hours)} ชม. · ${money(r.price)}</td><td>${esc(r.teaching_type||"")} ${esc(r.schedule_day||"")}</td><td><span class="chip ${r.status==="approved"?"green":r.status==="rejected"?"red":"amber"}">${({pending:"รอแอดมิน",approved:"อนุมัติแล้ว",rejected:"ปฏิเสธ",cancelled:"ยกเลิก"})[r.status]||r.status}</span></td><td>${esc(r.review_note||"—")}</td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">ยังไม่มีคำขอเปิดคอร์ส</div>'}</section>`}
function openCourseRequest(){showModal("ส่งคำขอเปิดคอร์ส",`<form id="course-request-form"><div class="message">กรอกข้อมูลให้ครบ แอดมินจะเห็นคำขอนี้ใน Dashboard และต้องกดอนุมัติก่อนคอร์สเผยแพร่</div><div class="form-grid"><div class="field wide"><label>ชื่อคอร์ส *</label><input class="input" name="title" required></div><div class="field"><label>ประเภทคอร์ส</label><input class="input" name="course_type" value="คอร์สเรียน"></div><div class="field"><label>จำนวนชั่วโมง</label><input class="input" type="number" step="0.25" min="0" name="hours" value="0"></div><div class="field"><label>ราคาเสนอ</label><input class="input" type="number" step="0.01" min="0" name="price" value="0"></div><div class="field"><label>รูปแบบ</label><select class="select" name="teaching_type"><option>ออนไลน์</option><option>ออนไซต์</option><option>Hybrid</option></select></div><div class="field"><label>วันเรียน</label><input class="input" name="schedule_day" placeholder="เช่น เสาร์"></div><div class="field"><label>เวลาเริ่ม</label><input class="input" type="time" name="start_time"></div><div class="field"><label>เวลาสิ้นสุด</label><input class="input" type="time" name="end_time"></div><div class="field wide"><label>ลิงก์/สถานที่</label><input class="input" name="location_or_link"></div><div class="field wide"><label>คำอธิบาย</label><textarea class="textarea" name="description"></textarea></div><div class="field wide"><label>คำอธิบายสำหรับนักเรียน</label><textarea class="textarea" name="public_description"></textarea></div><div class="field wide"><label>ภาพปก URL</label><input class="input" type="url" name="cover_url"></div><div class="field wide"><label>หมายเหตุถึงแอดมิน</label><textarea class="textarea" name="request_note"></textarea></div></div></form>`,`<button class="btn" data-close>ยกเลิก</button><button class="btn primary" id="save-course-request">ส่งคำขอ</button>`);$("#save-course-request").onclick=async()=>{const payload=Object.fromEntries(new FormData($("#course-request-form")).entries());try{window.AWAlert?.loading("กำลังส่งคำขอเปิดคอร์ส");await rpc("staff_v11_request_course",{p_payload:payload});window.AWAlert?.close();modal.classList.add("hidden");await window.AWAlert?.success("ส่งคำขอแล้ว","คอร์สจะปรากฏหลังแอดมินอนุมัติ");await load()}catch(e){window.AWAlert?.close();toast(e.message,true)}}}
function staffScheduleFor(enrollmentId){return (S.data.student_schedules||[]).find(x=>n(x.enrollment_id)===n(enrollmentId))}
function staffPlanFor(studentId,courseId){return (S.data.payment_plans||[]).find(x=>n(x.student_id)===n(studentId)&&n(x.course_id)===n(courseId)&&["active","paid"].includes(x.status))}
function staffCourseRowHtml(row={},idx=Date.now()){const c=course(row.course_id);return `<div class="course-enroll-row" data-course-row="${idx}" style="border:1px solid #dfe4ef;border-radius:17px;padding:13px;margin-top:10px;background:#fafbff"><div class="section-head" style="margin-bottom:9px"><div><b>คอร์ส วันเรียน และการชำระ</b></div><button type="button" class="btn danger small" data-remove-row>ลบ</button></div><div class="form-grid"><div class="field"><label>คอร์ส *</label><select class="select" data-f="course_id" required><option value="">เลือกคอร์ส</option>${(S.data.courses||[]).filter(x=>x.is_active!==false&&x.approval_status!=="rejected").map(x=>`<option value="${x.id}" ${n(row.course_id)===n(x.id)?"selected":""}>${esc(x.title)}</option>`).join("")}</select></div><div class="field"><label>ชั่วโมงทั้งหมด</label><input class="input" data-f="hours_total" type="number" step="0.25" min="0" value="${row.hours_total??c?.hours??0}"></div><div class="field"><label>ราคา</label><input class="input" data-f="price" type="number" step="0.01" min="0" value="${row.price??c?.price??0}"></div><div class="field"><label>วันเริ่มเรียน</label><input class="input" data-f="start_date" type="date" value="${esc(row.start_date||new Date().toISOString().slice(0,10))}"></div><div class="field"><label>วันเรียน</label><input class="input" data-f="schedule_day" value="${esc(row.schedule_day||c?.default_schedule_day||"")}"></div><div class="field"><label>เวลาเริ่ม</label><input class="input" data-f="start_time" type="time" value="${esc(String(row.start_time||c?.default_start_time||"").slice(0,5))}"></div><div class="field"><label>เวลาสิ้นสุด</label><input class="input" data-f="end_time" type="time" value="${esc(String(row.end_time||c?.default_end_time||"").slice(0,5))}"></div><div class="field"><label>รูปแบบ</label><select class="select" data-f="teaching_type">${["ออนไลน์","ออนไซต์","Hybrid"].map(x=>`<option ${String(row.teaching_type||c?.default_teaching_type||"ออนไลน์")===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label>สถานะชำระ</label><select class="select" data-f="payment_status">${["ยังไม่ชำระ","ชำระแล้ว","ค้างชำระ","แบ่งชำระ"].map(x=>`<option ${row.payment_status===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label>ช่องทาง</label><select class="select" data-f="payment_method"><option value="">ยังไม่ระบุ</option>${["โอนชำระ","เงินสด","พร้อมเพย์"].map(x=>`<option ${row.payment_method===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label>ยอดที่จ่ายมาก่อน</label><input class="input" data-f="paid_before" type="number" step="0.01" min="0" value="${n(row.paid_before)}"></div><div class="field"><label>จำนวนงวด</label><input class="input" data-f="installment_count" type="number" min="1" max="36" value="${n(row.installment_count||1)}"></div><div class="field"><label>ครบกำหนดงวดแรก</label><input class="input" data-f="first_due_date" type="date" value="${esc(row.first_due_date||new Date().toISOString().slice(0,10))}"></div><div class="field"><label>ห่างกันกี่วัน</label><input class="input" data-f="interval_days" type="number" min="1" value="${n(row.interval_days||30)}"></div><div class="field wide"><label>ลิงก์/สถานที่</label><input class="input" data-f="location_or_link" value="${esc(row.location_or_link||c?.default_location_or_link||"")}"></div><div class="field wide"><label>หมายเหตุ</label><input class="input" data-f="note" value="${esc(row.note||"")}"></div></div></div>`}
function bindStaffCourseRows(root=document){$$('[data-course-row]',root).forEach(row=>{$('[data-remove-row]',row).onclick=()=>row.remove();$('[data-f="course_id"]',row).onchange=e=>{const c=course(e.target.value);if(!c)return;const set=(f,v)=>{const el=$(`[data-f="${f}"]`,row);if(el&&!el.value)el.value=v??""};set("hours_total",c.hours);set("price",c.price);set("schedule_day",c.default_schedule_day);set("start_time",String(c.default_start_time||"").slice(0,5));set("end_time",String(c.default_end_time||"").slice(0,5));set("location_or_link",c.default_location_or_link)}})}

function openPlan(studentId=""){showModal("สร้างแผนแบ่งชำระ",`<form id="plan-form"><div class="form-grid"><div class="field"><label>นักเรียน</label><select class="select" name="student_id">${studentOptions(studentId)}</select></div><div class="field"><label>คอร์ส</label><select class="select" name="course_id"><option value="">ไม่ระบุคอร์ส</option>${courseOptions()}</select></div><div class="field wide"><label>ชื่อรายการ</label><input class="input" name="title" value="ค่าเรียน" required></div><div class="field"><label>ยอดรวม</label><input class="input" type="number" step="0.01" min="1" name="total_amount" required></div><div class="field"><label>ยอดที่จ่ายมาก่อนแล้ว</label><input class="input" type="number" step="0.01" min="0" name="paid_before" value="0"></div><div class="field"><label>จำนวนงวดของยอดคงเหลือ</label><input class="input" type="number" min="1" max="36" name="installment_count" value="2"></div><div class="field"><label>วันครบกำหนดงวดแรก</label><input class="input" type="date" name="first_due_date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>ห่างกันกี่วัน</label><input class="input" type="number" min="1" name="interval_days" value="30"></div><div class="field wide"><label>หมายเหตุ</label><textarea class="textarea" name="note"></textarea></div></div></form>`,`<button class="btn" data-close>ยกเลิก</button><button class="btn primary" id="save-plan">สร้างแผนและแจ้งนักเรียน</button>`);$("#save-plan").onclick=async()=>{const fd=new FormData($("#plan-form"));try{await rpc("staff_v9_create_payment_plan",{p_student_id:n(fd.get("student_id")),p_course_id:fd.get("course_id")?n(fd.get("course_id")):null,p_title:fd.get("title"),p_total_amount:n(fd.get("total_amount")),p_paid_before:n(fd.get("paid_before")),p_installment_count:n(fd.get("installment_count")),p_first_due_date:fd.get("first_due_date"),p_interval_days:n(fd.get("interval_days")),p_note:fd.get("note")||""});modal.classList.add("hidden");toast("สร้างแผนชำระเงินแล้ว");await load()}catch(e){toast(e.message,true)}}}
async function openAssetFile(id){const a=S.data.assets.find(x=>n(x.id)===n(id));try{if(a.url){window.open(a.url,"_blank","noopener");return}if(!a.storage_path)return;const {data,error}=await sb.storage.from("lesson-assets").createSignedUrl(a.storage_path,3600);if(error)throw error;window.open(data.signedUrl,"_blank","noopener")}catch(e){toast(e.message,true)}}
function parseCsvText(text){const rows=[];let row=[],cell="",quote=false;for(let i=0;i<text.length;i++){const ch=text[i],next=text[i+1];if(ch==='"'&&quote&&next==='"'){cell+='"';i++;continue}if(ch==='"'){quote=!quote;continue}if(ch===','&&!quote){row.push(cell);cell="";continue}if((ch==='\n'||ch==='\r')&&!quote){if(ch==='\r'&&next==='\n')i++;row.push(cell);cell="";if(row.some(v=>String(v).trim()!==""))rows.push(row);row=[];continue}cell+=ch}row.push(cell);if(row.some(v=>String(v).trim()!==""))rows.push(row);if(!rows.length)return[];const headers=rows.shift().map(h=>h.replace(/^\uFEFF/,"").trim());return rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,String(r[i]??"").trim()]))) }
function bind(){$$('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});$$('[data-logout]').forEach(b=>b.onclick=logout);$('[data-refresh]')?.addEventListener('click',()=>load());$('[data-quick-session]')?.addEventListener('click',openSession);$$('[data-go]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.go;render()});$$('[data-new-schedule]').forEach(b=>b.onclick=openSchedule);$$('[data-start-schedule]').forEach(b=>b.onclick=async()=>{try{const row=await rpc('staff_v9_start_schedule',{p_schedule_id:b.dataset.startSchedule});toast('เปิดคาบแล้ว');await load();openRoster(row.id)}catch(e){toast(e.message,true)}});$$('[data-cancel-schedule]').forEach(b=>b.onclick=async()=>{if(!confirm('ยกเลิกตารางนี้หรือไม่?'))return;try{await rpc('staff_v9_cancel_schedule',{p_schedule_id:b.dataset.cancelSchedule,p_note:'ยกเลิกโดยผู้สอน'});await load()}catch(e){toast(e.message,true)}});$$('[data-open-session]').forEach(b=>b.onclick=openSession);$$('[data-roster]').forEach(b=>b.onclick=()=>openRoster(b.dataset.roster));$$('[data-finalize]').forEach(b=>b.onclick=()=>finalizeSession(b.dataset.finalize));$$('[data-add-student]').forEach(b=>b.onclick=()=>openStudent());$$('[data-student-detail]').forEach(b=>b.onclick=()=>openStudent(b.dataset.studentDetail));$('#student-search')?.addEventListener('input',e=>{S.search=e.target.value;render()});$$('[data-new-note]').forEach(b=>b.onclick=()=>openNote(b.dataset.newNote||''));$$('[data-note-session]').forEach(b=>b.onclick=()=>openNote('',b.dataset.noteSession));$$('[data-new-topic]').forEach(b=>b.onclick=()=>openTopic());$$('[data-new-topic-course]').forEach(b=>b.onclick=()=>openTopic(b.dataset.newTopicCourse));$$('[data-add-asset]').forEach(b=>b.onclick=()=>openAsset(b.dataset.addAsset));$$('[data-course-settings]').forEach(b=>b.onclick=()=>openCourseSettings(b.dataset.courseSettings));$$('[data-new-code-course]').forEach(b=>b.onclick=()=>openCode(b.dataset.newCodeCourse));$$('[data-open-asset]').forEach(b=>b.onclick=()=>openAssetFile(b.dataset.openAsset));$$('[data-new-plan]').forEach(b=>b.onclick=()=>openPlan(b.dataset.newPlan||''));$$('[data-request-course]').forEach(b=>b.onclick=openCourseRequest);$$('[data-read]').forEach(b=>b.onclick=async()=>{try{await rpc('staff_v8_mark_notification_read',{p_id:n(b.dataset.read)});await load()}catch(e){toast(e.message,true)}});$('#profile-form')?.addEventListener('submit',async e=>{e.preventDefault();try{const p=await rpc('staff_v9_update_profile',{p_payload:Object.fromEntries(new FormData(e.currentTarget).entries())});S.data.profile=p;toast('บันทึกโปรไฟล์แล้ว');render()}catch(x){toast(x.message,true)}});$('[data-parse-csv]')?.addEventListener('click',async()=>{const file=$('#csv-file')?.files?.[0];if(!file)return toast('กรุณาเลือกไฟล์ CSV',true);try{S.csvRows=parseCsvText(await file.text());if(!S.csvRows.length)throw new Error('ไม่พบข้อมูลในไฟล์');toast(`อ่านไฟล์แล้ว ${S.csvRows.length} แถว`);render()}catch(e){toast(e.message,true)}});$('[data-import-csv]')?.addEventListener('click',async()=>{if(!S.csvRows.length)return;try{const file=$('#csv-file')?.files?.[0];const r=await rpc('staff_v9_import_learning_rows',{p_rows:S.csvRows,p_file_name:file?.name||'upload.csv'});showModal('ผลการนำเข้า',`<div class="grid metrics"><div class="card metric"><small>ทั้งหมด</small><strong>${r.total}</strong></div><div class="card metric"><small>เพิ่มสำเร็จ</small><strong>${r.inserted}</strong></div><div class="card metric"><small>ข้อมูลซ้ำ</small><strong>${r.skipped}</strong></div><div class="card metric"><small>ผิดพลาด</small><strong>${r.errors?.length||0}</strong></div></div>${r.errors?.length?`<div class="message error" style="margin-top:14px">${r.errors.slice(0,20).map(e=>`แถว ${e.row}: ${esc(e.message)}`).join('<br>')}</div>`:''}`,'<button class="btn primary" data-close>ปิด</button>');S.csvRows=[];await load(false)}catch(e){toast(e.message,true)}});$('#schedule-search')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase();$$('#schedule-list .event').forEach(el=>el.style.display=el.textContent.toLowerCase().includes(q)?'':'none')})}
async function load(show=true){if(show)app.innerHTML='<div class="loading"><div><div class="spinner"></div><b>กำลังโหลดข้อมูลตามสิทธิ์ผู้สอน...</b></div></div>';try{S.data=await rpc('staff_v11_bootstrap');render()}catch(e){app.innerHTML=`<div class="loading"><div class="auth-card"><h2>เปิด Tutor Hub ไม่สำเร็จ</h2><div class="message error">${esc(e.message)}</div><button class="btn primary wide" id="retry">ลองใหม่</button><button class="btn wide" data-logout style="margin-top:8px">ออกจากระบบ</button></div></div>`;$('#retry').onclick=()=>load();$('[data-logout]').onclick=logout}}
async function logout(){clearInterval(S.poll);await sb.auth.signOut({scope:'local'});S.session=null;S.data=null;app.innerHTML=authHtml();bindAuth()}
function bindAuth(){$$('[data-auth-mode]').forEach(b=>b.onclick=()=>{S.authMode=b.dataset.authMode;app.innerHTML=authHtml();bindAuth()});$('#login')?.addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(e.currentTarget),id=String(fd.get('identifier')).trim(),password=String(fd.get('password')),box=$('#auth-message');box.innerHTML='<div class="message">กำลังเข้าสู่ระบบ...</div>';try{if(id.includes('@')){const{data,error}=await sb.auth.signInWithPassword({email:id.toLowerCase(),password});if(error)throw error;S.session=data.session}else{await signInByMemberCode(id,password);S.session=(await sb.auth.getSession()).data.session}await load()}catch(x){box.innerHTML=`<div class="message error">${esc(x.message)}</div>`}});$('#tutor-register')?.addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(e.currentTarget),box=$('#auth-message'),password=String(fd.get('password')),confirm=String(fd.get('confirm_password'));if(password!==confirm){box.innerHTML='<div class="message error">ยืนยันรหัสผ่านไม่ตรงกัน</div>';return}box.innerHTML='<div class="message">กำลังสร้างบัญชีติวเตอร์...</div>';try{const r=await portalAuth('register_tutor',{tutor_code:fd.get('tutor_code'),email:fd.get('email'),phone:fd.get('phone'),password,pin:fd.get('pin')});const{data,error}=await sb.auth.signInWithPassword({email:String(fd.get('email')).trim().toLowerCase(),password});if(error)throw error;S.session=data.session;toast(`เปิดบัญชี ${r.tutor_code} เรียบร้อย`);await load()}catch(x){box.innerHTML=`<div class="message error">${esc(x.message)}</div>`}});$('#tutor-reset')?.addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(e.currentTarget),box=$('#auth-message'),password=String(fd.get('new_password'));if(password!==String(fd.get('confirm_password'))){box.innerHTML='<div class="message error">ยืนยันรหัสผ่านไม่ตรงกัน</div>';return}box.innerHTML='<div class="message">กำลังเปลี่ยนรหัสผ่าน...</div>';try{await portalAuth('reset_tutor_password',{tutor_code:fd.get('tutor_code'),email:fd.get('email'),pin:fd.get('pin'),new_password:password});S.authMode='login';app.innerHTML=authHtml();bindAuth();$('#auth-message').innerHTML='<div class="message">เปลี่ยนรหัสผ่านแล้ว กรุณาเข้าสู่ระบบ</div>'}catch(x){box.innerHTML=`<div class="message error">${esc(x.message)}</div>`}})}
async function boot(){const {data}=await sb.auth.getSession();S.session=data.session;if(S.session){await load();S.poll=setInterval(()=>load(false),60000)}else{app.innerHTML=authHtml();bindAuth()}sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT'){S.session=null;app.innerHTML=authHtml();bindAuth()}})}
boot();
